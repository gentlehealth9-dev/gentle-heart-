<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長者中心客戶管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2EA;
  --panel:#FFFFFF;
  --ink:#2B2620;
  --ink-soft:#6B6357;
  --line:#E4DDCE;
  --teal:#33565A;
  --teal-dark:#22393C;
  --clay:#BD6B4C;
  --clay-soft:#F1DCD1;
  --sage:#7C9A82;
  --sage-soft:#E4EEE4;
  --amber:#B8822E;
  --amber-soft:#F5E8CE;
  --red:#A1443A;
  --red-soft:#F3DEDA;
  --radius:10px;
  --shadow:0 1px 2px rgba(43,38,32,0.06), 0 4px 14px rgba(43,38,32,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.serif{font-family:'Noto Serif TC',serif;}

/* ---- App shell ---- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:212px; flex-shrink:0;
  background:var(--teal-dark);
  color:#EFE7D8;
  display:flex; flex-direction:column;
  padding:22px 14px;
  position:sticky; top:0; height:100vh;
}
.brand{
  font-family:'Noto Serif TC',serif;
  font-weight:700; font-size:18px;
  letter-spacing:.02em;
  color:#F6F2EA;
  margin-bottom:2px;
}
.brand-sub{
  font-size:11px; color:#9FB3AE; margin-bottom:26px; letter-spacing:.04em;
}
.navlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px;}
.navlist button{
  all:unset; cursor:pointer;
  display:flex; align-items:center; gap:9px;
  padding:9px 10px; border-radius:8px;
  font-size:13.5px; color:#D9D1BF;
  transition:background .15s, color .15s;
}
.navlist button:hover{background:rgba(255,255,255,0.06); color:#fff;}
.navlist button.active{background:#F6F2EA; color:var(--teal-dark); font-weight:700;}
.navlist .ico{width:16px; text-align:center; font-size:14px;}
.side-foot{margin-top:auto; font-size:10.5px; color:#78897F; line-height:1.6; padding-top:16px;}

.main{flex:1; min-width:0; padding:26px 34px 60px;}
.topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.page-title{font-family:'Noto Serif TC',serif; font-weight:700; font-size:22px; color:var(--teal-dark);}
.page-sub{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}

/* ---- Cards / panels ---- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-pad{padding:18px 20px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

/* ---- Mobile layout ---- */
@media (max-width:760px){
  #app{flex-direction:column;}
  .sidebar{
    position:static; width:100%; height:auto; flex-direction:row; flex-wrap:wrap;
    align-items:center; padding:12px 14px; gap:8px;
  }
  .brand-sub{display:none;}
  .brand{margin-bottom:0; margin-right:auto; font-size:15px;}
  #readOnlyBadge{margin-bottom:0;}
  .navlist{flex-direction:row; flex-wrap:wrap; width:100%; order:3; gap:6px;}
  .navlist button{padding:7px 9px; font-size:12.5px;}
  .side-foot{order:2; width:100%; margin-top:0; padding-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .side-foot br{display:none;}
  .side-foot button{width:auto; flex:1 1 auto; margin-top:0 !important;}
  .main{padding:16px 12px 40px;}
  .topbar{flex-direction:column; align-items:stretch;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .modal{width:100% !important; max-width:100%; border-radius:0; max-height:100vh;}
  .overlay{padding:0;}
  table.datatable{font-size:12px;}
  .search-row input[type=text]{width:100%;}
  .search-row{flex-direction:column; align-items:stretch;}
}

.stat{
  padding:16px 18px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel);
}
.stat .num{font-family:'Noto Serif TC',serif; font-size:30px; font-weight:700; color:var(--teal-dark); line-height:1.1;}
.stat .label{color:var(--ink-soft); font-size:12px; margin-top:4px;}
.stat.warn{background:var(--amber-soft); border-color:#E3CD9A;}
.stat.warn .num{color:var(--amber);}
.stat.danger{background:var(--red-soft); border-color:#E3B9B2;}
.stat.danger .num{color:var(--red);}

/* ---- Buttons/inputs ---- */
button.btn{
  all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:8px; font-size:13px; font-weight:500;
  background:var(--teal); color:#fff; transition:background .15s;
}
button.btn:hover{background:var(--teal-dark);}
button.btn.ghost{background:transparent; color:var(--teal); border:1px solid var(--teal);}
button.btn.ghost:hover{background:var(--sage-soft);}
button.btn.warn{background:var(--clay); color:#fff;}
button.btn.warn:hover{background:#a15236;}
button.btn.sm{padding:5px 10px; font-size:12px;}
button.btn.tiny{padding:3px 8px; font-size:11.5px; border-radius:6px;}
button.btn:disabled{opacity:.4; cursor:not-allowed;}

input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{
  font-family:inherit; font-size:13px; padding:7px 10px; border-radius:7px;
  border:1px solid var(--line); background:#fff; color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage); outline-offset:1px;}
label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft);}
label.field input,label.field select,label.field textarea{color:var(--ink); font-size:13.5px;}

/* ---- Table ---- */
table.datatable{width:100%; border-collapse:collapse; font-size:13px;}
table.datatable th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--ink-soft); padding:9px 10px; border-bottom:2px solid var(--line);
  background:#FBF8F2; position:sticky; top:0;
}
table.datatable td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.datatable tr:hover td{background:#FAF6EE;}
.table-wrap{max-height:70vh; overflow:auto; border-radius:var(--radius); border:1px solid var(--line);}

.badge{
  display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
  background:var(--sage-soft); color:#3E6448; margin-right:3px;
}
.badge.gray{background:#EEE9DD; color:var(--ink-soft);}
.badge.clay{background:var(--clay-soft); color:#8C4B32;}
.badge.amber{background:var(--amber-soft); color:#8C6318;}
.badge.red{background:var(--red-soft); color:var(--red);}
.badge.teal{background:#DCEAE8; color:var(--teal-dark);}
.badge.sage{background:var(--sage-soft); color:#3E6448;}

.pill-days{display:flex; gap:3px;}
.pill-days span{
  width:20px; height:20px; border-radius:5px; font-size:10px; font-weight:700;
  display:flex; align-items:center; justify-content:center; background:#EEE9DD; color:#B8AF9B;
}
.pill-days span.on{background:var(--sage); color:#fff;}

.search-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-row input[type=text]{width:220px;}

/* ---- Seating chart ---- */
.seating-layout{display:grid; grid-template-columns:220px 1fr; gap:16px; align-items:start;}
@media (max-width:900px){ .seating-layout{grid-template-columns:1fr;} }
.seat-roster{max-height:75vh; overflow:auto; display:flex; flex-direction:column; gap:6px;}
.seat-chip{
  display:flex; align-items:center; gap:6px; padding:7px 9px; border-radius:8px;
  background:var(--panel); border:1px solid var(--line); cursor:grab; font-size:12.5px;
}
.seat-chip:active{cursor:grabbing;}
.seat-chip .mono{color:var(--ink-soft); font-size:11px;}
.seat-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:10px;}
@media (max-width:1300px){ .seat-grid{grid-template-columns:repeat(4,1fr);} }
.seat-table{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:8px; display:flex; flex-direction:column; gap:5px;
}
.seat-stage{
  background:repeating-linear-gradient(135deg, var(--line), var(--line) 8px, transparent 8px, transparent 16px);
  border:1px dashed var(--ink-soft); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:var(--ink-soft); letter-spacing:.15em;
  min-height:106px;
}
.seat-table .table-label{text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); letter-spacing:.03em;}
.seat-table .seat-row{display:flex; gap:4px;}
.seat-slot{
  flex:1; min-width:0; height:44px; border-radius:6px; border:1.5px dashed var(--line);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:10.5px; line-height:1.25; color:var(--ink-soft); padding:2px; position:relative;
  cursor:pointer;
}
.seat-slot.occupied{
  border-style:solid; border-color:#C9DFC9; background:var(--sage-soft); color:#2E4E33;
  cursor:grab; font-weight:700; font-size:14px;
}
.seat-slot.drag-over{border-color:var(--teal); background:#DCEAE8;}
.seat-slot-input{
  flex:1; min-width:0; height:44px; border-radius:6px; border:1.5px solid var(--teal);
  text-align:center; font-size:13px; font-weight:700; color:var(--ink); padding:2px;
  outline:none; background:#fff;
}
.seat-slot .seat-remove{
  position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%;
  background:var(--red); color:#fff; font-size:10px; line-height:16px; text-align:center;
  cursor:pointer; display:none;
}
.seat-slot.occupied:hover .seat-remove{display:block;}

/* ---- Modal ---- */
.overlay{
  position:fixed; inset:0; background:rgba(34,29,22,0.45); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  background:#fff; border-radius:14px; width:640px; max-width:100%; max-height:88vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
.modal-head{
  padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; background:#fff; z-index:2;
}
.modal-head h3{margin:0; font-family:'Noto Serif TC',serif; font-size:18px; color:var(--teal-dark);}
.modal-body{padding:20px 22px;}
.modal-foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.x-close{all:unset; cursor:pointer; font-size:18px; color:var(--ink-soft); padding:4px 8px; border-radius:6px;}
.x-close:hover{background:#EEE9DD;}

.section-label{font-size:12px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 8px;}
.section-label:first-child{margin-top:0;}

.hist-item{padding:8px 10px; border-radius:7px; background:#FBF8F2; border:1px solid var(--line); font-size:12.5px; margin-bottom:6px; display:flex; justify-content:space-between; gap:8px;}
.hist-item .meta{color:var(--ink-soft);}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty-state .big{font-size:34px; margin-bottom:8px;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--teal-dark); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
  box-shadow:var(--shadow); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.tag-row{display:flex; gap:6px; flex-wrap:wrap;}
.driver-chip{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px;
  background:var(--panel); border:1px solid var(--line); font-size:12px; cursor:pointer;
}
.driver-chip.active{background:var(--teal); color:#fff; border-color:var(--teal);}

.kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px;}
.kv .k{color:var(--ink-soft);}

.note-flag{color:var(--clay); font-weight:600;}

/* Print styles */
@media print{
  .sidebar,.topbar .actions,.no-print,.search-row,.overlay{display:none !important;}
  .main{padding:0; margin:0;}
  body{background:#fff;}
  .card{box-shadow:none; border:none;}
  .table-wrap{max-height:none; overflow:visible; border:none;}
  table.datatable th{position:static; background:#fff;}
}
.print-title{font-family:'Noto Serif TC',serif; font-size:16px; font-weight:700; margin-bottom:2px;}
.print-sub{color:#555; font-size:16px; margin-bottom:14px;}
.sig-table td, .sig-table th{border:1px solid #999; padding:6px 8px; text-align:center;}
.sig-table{width:100%; border-collapse:collapse; font-size:16px; margin-top:6px;}
.sig-table th{background:#F0EBDD;}
.sig-table tr{page-break-inside:avoid; break-inside:avoid;}

.scroll-x{overflow-x:auto;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#D8CFBC; border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* Print preview pane (avoids blocked window.print()/window.open() inside sandboxed iframe) */
.print-preview-pane{
  position:fixed; inset:0; background:#fff; z-index:200; overflow:auto;
  padding:34px 40px; display:none;
  font-family:'Aptos Display','Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  line-height:normal; /* don't inherit the app shell's 1.5 — throws off every print sheet's measured row heights */
}
.print-preview-bar{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--amber-soft); border:1px solid #E3CD9A; border-radius:10px;
  padding:12px 16px; margin-bottom:22px; font-size:13.5px; color:#6B4E14;
}
.print-preview-bar b{font-size:14px;}
/* #app{min-height:100vh} keeps reserving a full-viewport-tall blank block
   even once its children below are hidden, pushing all print content down
   by ~1 viewport height and badly inflating page counts — so hide #app
   itself outright, not just its contents. */
body.print-mode-active #app{display:none !important;}
body.print-mode-active .sidebar,
body.print-mode-active .main{display:none !important;}
body.print-mode-active .print-preview-pane{display:block;}
@media print{
  .print-preview-bar{display:none !important;}
  body:not(.print-mode-active) .print-preview-pane{display:none !important;}
  /* Fixed positioning clips content to one viewport height when printing —
     switch to normal document flow so multi-page content isn't cut off. */
  html, body{height:auto !important; overflow:visible !important;}
  .print-preview-pane{
    position:static !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
    /* Keep in sync with PRINT_SAFE_INSET_PX (JS) — a table border sitting
       exactly flush with the page's @page margin box has no room for
       error, and real printers can clip a line right at that edge even
       though on-screen/headless rendering shows it complete. */
    padding:8px !important;
  }
}
</style>

<script>
const RAW_TEMPLATE = document.documentElement.outerHTML;
/* =========================================================
   長者中心客戶管理系統
   Data layer + utilities
   ========================================================= */
// Requires the page to be published with capabilities: { artifact: {} } via the Artifact tool.

const DAY_KEYS = ["Mon","Tue","Wed","Thu","Fri"];
const DAY_LABEL = {Mon:"一",Tue:"二",Wed:"三",Thu:"四",Fri:"五"};
const DAY_LABEL_FULL = {Mon:"星期一",Tue:"星期二",Wed:"星期三",Thu:"星期四",Fri:"星期五"};
const STATUS_LABEL = {active:"在籍",pending:"待安排",returned_home:"已返國",discontinued:"已停止"};
const STATUS_BADGE = {active:"", pending:"amber", returned_home:"gray", discontinued:"red"};

let CLIENTS = [];      // array of client objects
let EXCEPTIONS = {};   // { "YYYY-MM-DD": [ {clientId, type:'leave'|'extra', note, linkedDate} ] }
let DRIVER_CAPACITIES = {}; // { driverName: number } 每位司機車輛可載座位上限（沒設定則用預設值）
let LAST_BACKUP_AT = null; // ISO timestamp of the last exportBackup(), shared across everyone via app-state so any staff member's export counts for all
let SEATS = {}; // { seatId: clientId } — fixed seating chart, see renderSeating()
let CURRENT_TAB = "dashboard";
let DATA_READY = false;

function uid(){ return Math.random().toString(36).slice(2,9); }

function todayStr(){
  const d = new Date();
  return ymd(d);
}
function ymd(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function weekdayKeyOf(dateStr){
  const d = parseDate(dateStr);
  const idx = d.getDay(); // 0 Sun ... 6 Sat
  const map = {1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri"};
  return map[idx] || null;
}
// Center is closed weekends — "tomorrow" should skip straight past
// Sat/Sun to the next actual business day (e.g. Friday -> Monday).
function nextBusinessDay(dateStr){
  let d = addDays(dateStr, 1);
  while(!weekdayKeyOf(d)) d = addDays(d, 1);
  return d;
}
function fmtDateHuman(dateStr){
  const d = parseDate(dateStr);
  const wd = weekdayKeyOf(dateStr);
  const wLabel = wd ? DAY_LABEL_FULL[wd] : "週末";
  return `${dateStr}（${wLabel}）`;
}
const DAY_LABEL_EN = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};
function fmtDateEnglish(dateStr){
  const wd = weekdayKeyOf(dateStr);
  const wLabel = wd ? DAY_LABEL_EN[wd] : "Weekend";
  return `${dateStr} (${wLabel})`;
}
function fmtDateMDY(dateStr){
  const d = parseDate(dateStr);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${d.getFullYear()}`;
}
function mondayOf(dateStr){
  const d = parseDate(dateStr);
  const day = d.getDay(); // 0 Sun
  const diff = (day===0) ? -6 : 1-day;
  const mon = new Date(d); mon.setDate(d.getDate()+diff);
  return ymd(mon);
}
function addDays(dateStr,n){
  const d = parseDate(dateStr); d.setDate(d.getDate()+n); return ymd(d);
}
function weekDates(mondayStr){
  return DAY_KEYS.map((k,i)=>addDays(mondayStr,i));
}

/* ---------- storage (Claude Artifact persistence) ---------- */
async function loadData(){
  function loadFromSeed(){
    const seedEl = document.getElementById('clients-seed-data');
    CLIENTS = JSON.parse(seedEl.textContent);
    EXCEPTIONS = {};
    DRIVER_CAPACITIES = {};
    SEATS = {};
    // First-ever load (no published state yet): fold the one-time data
    // migrations into the seed once, in memory. Once this state is
    // persisted via persistState(), future loads read #app-state instead
    // and this never runs again.
    applyOneTimePatches();
  }
  try{
    const stateEl = document.getElementById('app-state');
    const stateText = stateEl && stateEl.textContent ? stateEl.textContent.trim() : '';
    if(stateText){
      const state = JSON.parse(stateText);
      CLIENTS = Array.isArray(state.clients) ? state.clients : [];
      EXCEPTIONS = (state.exceptions && typeof state.exceptions === 'object') ? state.exceptions : {};
      DRIVER_CAPACITIES = (state.capacities && typeof state.capacities === 'object') ? state.capacities : {};
      LAST_BACKUP_AT = typeof state.lastBackupAt === 'string' ? state.lastBackupAt : null;
      SEATS = (state.seats && typeof state.seats === 'object') ? state.seats : {};
    } else {
      loadFromSeed();
    }
  }catch(err){
    console.error('failed to parse saved app state, falling back to seed', err);
    try{ loadFromSeed(); }catch(err2){ console.error('seed load failed too', err2); CLIENTS = []; EXCEPTIONS = {}; DRIVER_CAPACITIES = {}; }
  }
  DATA_READY = true;
  document.getElementById('lastSync').textContent = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  updateBackupIndicator();
}

// One-time data migrations that shaped the original seed data. These only
// ever run once, in memory, against a fresh seed load (see loadFromSeed()
// above) — after that the migrated result is what gets persisted, so this
// function never needs to run again.
function applyOneTimePatches(){
  let applied = [];

  let clientsChanged = false;
  let exceptionsChanged = false;

  // --- Patch 1: 2026-08-20 uber/self-drive classification + dietary + notes ---
  const patchId1 = 'patch-2026-08-20-uber';
  if(!applied.includes(patchId1)){
    const patchEl = document.getElementById(patchId1);
    if(patchEl){
      try{
        const patch = JSON.parse(patchEl.textContent);
        CLIENTS.forEach(c=>{
          const p = patch[c.id];
          if(p){
            if(p.subMode) c.subMode = p.subMode;
            if(p.dietary) c.dietary = p.dietary;
            if(p.note) c.note = p.note;
            clientsChanged = true;
          }
        });
      }catch(e){ console.error('patch1 apply failed', e); }
    }
    applied.push(patchId1);
  }

  // --- Patch 2: 2026-08-20 roster re-upload — dietary/notes refresh + newly recorded leave exceptions ---
  const patchId2 = 'patch-2026-08-20-notes-update';
  if(!applied.includes(patchId2)){
    const patchEl = document.getElementById(patchId2);
    if(patchEl){
      try{
        const patch = JSON.parse(patchEl.textContent);
        const clientUpdates = patch.clientUpdates || {};
        const newExceptions = patch.newExceptions || {};

        CLIENTS.forEach(c=>{
          const p = clientUpdates[c.id];
          if(p){
            if(p.dietary) c.dietary = p.dietary;
            if(p.note) c.note = p.note;
            clientsChanged = true;
          }
        });

        Object.keys(newExceptions).forEach(date=>{
          const entries = newExceptions[date];
          if(!EXCEPTIONS[date]) EXCEPTIONS[date] = [];

/* ---------- Claude Artifact persistence ----------
   Every mutation to CLIENTS/EXCEPTIONS is persisted by publishing a new
   version of this whole page, with the current state re-embedded in the
   #app-state <script> tag. The platform live-reloads every other open
   view to that new version, so all viewers converge on the latest data. */
let READ_ONLY = false;
let __artifactUnavailableWarned = false;

function escapeStateForScriptTag(json){
  return json.replace(/</g, '\\u003c');
}

function buildPublishHTML(){
  const stateJSON = escapeStateForScriptTag(JSON.stringify({clients: CLIENTS, exceptions: EXCEPTIONS, capacities: DRIVER_CAPACITIES, lastBackupAt: LAST_BACKUP_AT, seats: SEATS}));
  // outerHTML never includes the doctype, so prefix it back on.
  const html = '<!doctype html>\n' + RAW_TEMPLATE;
  return html.replace(
    /<script id="app-state" type="application\/json">[\s\S]*?<\/script>/,
    `<script id="app-state" type="application/json">${stateJSON}<\/script>`
  );
}

function setReadOnlyMode(){
  if(READ_ONLY) return;
  READ_ONLY = true;
  const badge = document.getElementById('readOnlyBadge');
  if(badge) badge.style.display = '';
  showToast('您沒有編輯權限，此為唯讀檢視');
}

// Block write-affordance buttons app-wide once we've learned this view is
// read-only. Registered once; a no-op until READ_ONLY flips true.
document.addEventListener('click', function(e){
  if(!READ_ONLY) return;
  const btn = e.target.closest('button.btn');
  if(btn && !btn.classList.contains('tiny')){
    e.preventDefault();
    e.stopPropagation();
    showToast('唯讀模式，無法編輯');
  }
}, true);

const UI_RESTORE_KEY = 'gh_ui_restore_state';

// Publishing (below) makes the platform reload this same view to the newly
// saved version, which re-runs the whole page from scratch — CURRENT_TAB
// resets to "dashboard" and any open member modal is gone. Stash what was
// on screen right before publishing so the boot sequence can put it back.
function saveUIStateForReload(){
  try{
    const state = { tab: CURRENT_TAB };
    const overlay = document.getElementById('memberOverlay');
    if(overlay){
      const idInput = document.getElementById('f_id_original');
      if(idInput && idInput.value) state.memberModalId = idInput.value;
    }
    sessionStorage.setItem(UI_RESTORE_KEY, JSON.stringify(state));
  }catch(e){}
}

async function persistState(){
  document.getElementById('lastSync').textContent = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  let artifactNs = null;
  try{
    if(typeof claude !== 'undefined' && claude && claude.use){
      artifactNs = await claude.use('artifact');
    }
  }catch(e){ artifactNs = null; }

  if(!artifactNs){
    if(!__artifactUnavailableWarned){
      __artifactUnavailableWarned = true;
      showToast('此檢視不支援自動儲存');
    }
    return;
  }

  try{
    saveUIStateForReload();
    await artifactNs.publish(buildPublishHTML());
  }catch(err){
    const code = err && err.code;
    if(code === 'conflict'){
      // Someone else published first — the platform is already reloading
      // this view to the winning version. Nothing to do.
      return;
    }
    if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){
      setReadOnlyMode();
      return;
    }
    console.error('persistState failed', err);
    showToast('儲存失敗，請稍後再試');
  }
}

// Kept as thin aliases so every existing call site keeps working unchanged.
async function saveClients(){ return persistState(); }
async function saveExceptions(){ return persistState(); }

function showToast(msg, durationMs){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), durationMs||2200);
}

/* ---------- client lookups ---------- */
function getClient(id){ return CLIENTS.find(c=>c.id===id); }
function getSpouseId(client){
  if(!client || !client.relationship) return null;
  const m = client.relationship.match(/^\s*([^\/\s]+)\s*\/\s*([^\/\s]+)\s*夫妻/);
  if(!m) return null;
  const a = m[1], b = m[2];
  if(a === client.id) return b;
  if(b === client.id) return a;
  return null;
}
function clientLabel(c){ return `${c.enName}／${c.cnName || ''}`.replace(/／$/,''); }

/* ---------- schedule engine ---------- */
// returns array of {client, isExtra, note}
function getScheduledForDate(dateStr, opts){
  opts = opts || {};
  const wd = weekdayKeyOf(dateStr);
  const dayExceptions = EXCEPTIONS[dateStr] || [];
  const leaveIds = new Set(dayExceptions.filter(e=>e.type==='leave').map(e=>e.clientId));
  const extraEntries = dayExceptions.filter(e=>e.type==='extra');
  const adjustByClient = {};
  dayExceptions.filter(e=>e.type==='adjust').forEach(e=>{ adjustByClient[e.clientId] = e; });

  function applyAdjust(c){
    const adj = adjustByClient[c.id];
    if(!adj) return {client:c, isAdjusted:false, adjustNote:''};
    const effective = Object.assign({}, c);
    if(adj.driverOverride) effective.driver = adj.driverOverride;
    if(adj.transportOverride) effective.transportMode = adj.transportOverride;
    if(adj.subModeOverride) effective.subMode = adj.subModeOverride;
    return {client:effective, isAdjusted:true, adjustNote:adj.note||''};
  }

  // ERS clients (a permanent per-client flag, see f_ers in the member modal)
  // never actually come to the center or need pickup on their recurring
  // baseline days — only the kitchen sheet needs to see them there (so the
  // kitchen knows to still prepare/deliver their meal). Every other
  // consumer of this function (dashboard, schedule, drivers, sign-in
  // sheets) calls it with no options and so never sees an ERS client via
  // their baseline pattern.
  // An explicit one-off "extra" entry for an ERS client is different: staff
  // added it on purpose for that specific date, which only makes sense as
  // "they're actually coming in person today" — so extras always show,
  // regardless of includeErs.
  let list = [];
  if(wd){
    CLIENTS.forEach(c=>{
      if(c.status!=='active') return;
      if(c.ers && !opts.includeErs) return;
      if(!c.baselineDays.includes(wd)) return;
      if(leaveIds.has(c.id)) return;
      const {client, isAdjusted, adjustNote} = applyAdjust(c);
      list.push({client, isExtra:false, note:'', isAdjusted, adjustNote});
    });
  }
  extraEntries.forEach(e=>{
    // A leave entry for the same client/date always wins over an older or
    // otherwise-unrelated extra entry — staff marking someone as 請假 must
    // reliably remove them from the day's schedule, even if an extra entry
    // for that date already existed (e.g. added earlier for a different
    // reason and never cleaned up).
    if(leaveIds.has(e.clientId)) return;
    const c = getClient(e.clientId);
    if(c){
      const {client, isAdjusted, adjustNote} = applyAdjust(c);
      list.push({client, isExtra:true, note:e.note||'', isAdjusted, adjustNote});
    }
  });
  // de-dup in case a client is both baseline-present and extra somehow
  const seen = new Set();
  list = list.filter(item=>{
    if(seen.has(item.client.id)) return false;
    seen.add(item.client.id); return true;
  });
  list.sort((a,b)=> (a.client.enName||'').localeCompare(b.client.enName||''));
  return list;
}

function getAdjustEntries(dateStr){
  return (EXCEPTIONS[dateStr]||[]).filter(e=>e.type==='adjust');
}

// Most ERS clients are delivery-only and never need a driver, so every
// driver-facing view (route sheet, share card, Maps navigation) normally
// gets them excluded for free via getScheduledForDate's default options.
// A few ERS clients (member record checkbox "ERS但仍需司機固定接送",
// c.ersPickup) DO have a genuine fixed in-person schedule with a company
// driver despite the ERS flag — this variant includes exactly those,
// without affecting the regular schedule/kitchen/sign-in views, which
// keep calling getScheduledForDate directly.
function getDriverScheduledForDate(dateStr){
  return getScheduledForDate(dateStr, {includeErs:true}).filter(x=>!x.client.ers || x.client.ersPickup);
}

// An ERS client normally never comes to the center (delivery/meal-only),
// but an explicit "extra" entry for that date means staff added them on
// purpose because they ARE actually coming in person that day — so they
// should NOT be treated as delivery-only for that date.
function isErsDeliveryOnlyToday(client, dateStr){
  if(!client.ers) return false;
  return !(EXCEPTIONS[dateStr]||[]).some(e=>e.type==='extra' && e.clientId===client.id);
}

// Kitchen headcount is counted exactly with no buffer, so a leave/extra
// entered after the kitchen sheet was printed can throw the count off.
// Surface the most recent leave/extra edit for the date so staff can see
// at a glance whether the sheet in hand might already be out of date.
function getLatestScheduleEditTime(dateStr){
  const entries = (EXCEPTIONS[dateStr]||[]).filter(e=>e.type==='leave'||e.type==='extra');
  if(!entries.length) return null;
  return entries.reduce((latest,e)=> (!latest || e.createdAt>latest) ? e.createdAt : latest, null);
}
function fmtEditTime(iso){
  if(!iso) return '';
  try{
    return new Date(iso).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  }catch(e){ return ''; }
}

function getLeaveEntries(dateStr){
  return (EXCEPTIONS[dateStr]||[]).filter(e=>e.type==='leave');
}

function addException(dateStr, entry){
  if(!EXCEPTIONS[dateStr]) EXCEPTIONS[dateStr]=[];
  EXCEPTIONS[dateStr].push(Object.assign({id:uid(), createdAt:new Date().toISOString()}, entry));
}
function removeException(dateStr, excId){
  if(!EXCEPTIONS[dateStr]) return;
  EXCEPTIONS[dateStr] = EXCEPTIONS[dateStr].filter(e=>e.id!==excId);
  if(EXCEPTIONS[dateStr].length===0) delete EXCEPTIONS[dateStr];
}

function getClientHistory(clientId){
  const rows = [];
  Object.keys(EXCEPTIONS).sort().forEach(date=>{
    EXCEPTIONS[date].forEach(e=>{
      if(e.clientId===clientId){
        rows.push(Object.assign({date}, e));
      }
    });
  });
  return rows.reverse();
}

// weekly insurance usage: count of scheduled days (Mon-Fri) for a given client within a week
function weekUsage(clientId, mondayStr){
  const dates = weekDates(mondayStr);
  let count = 0;
  const days = [];
  dates.forEach((d,i)=>{
    const sched = getScheduledForDate(d);
    const present = sched.some(x=>x.client.id===clientId);
    if(present){ count++; days.push(DAY_KEYS[i]); }
  });
  return {count, days};
}

function dietaryCategory(text){
  if(!text) return null;
  const t = text.trim();
  if(!t) return null;
  return t;

function escapeHtml(s){

}

/* =========================================================
   Quick natural-language instruction parser
   e.g. "52明天来128不来" -> [{clientId:'52', date:tomorrow, type:'extra'}, {clientId:'128', date:tomorrow, type:'leave'}]
   ========================================================= */
const CN_WEEKDAY_MAP = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
const KNOWN_DRIVERS = ['夏师傅','霍师傅','尚师傅','杜师傅','Zhu师傅','Jennifer','民师傅','Summer','Boss','小林師傅','韓师傅','Peter'];
const OUTSOURCED_DRIVERS = ['尚师傅','霍师傅','Jennifer','Summer'];
function driverTypeLabel(driverName){
  if(!driverName) return '';
  return OUTSOURCED_DRIVERS.includes(driverName) ? '外包' : '中心自有';
}

function nextWeekdayDate(cnChar){
  const target = CN_WEEKDAY_MAP[cnChar];
  if(target===undefined) return null;
  const today = todayStr();
  const dow = parseDate(today).getDay();
  const daysSinceMonday = (dow+6)%7;
  const thisMonday = addDays(today, -daysSinceMonday);
  const nextMonday = addDays(thisMonday, 7);
  const offset = (target===0) ? 6 : target-1;
  return addDays(nextMonday, offset);
}

function parseQuickInstruction(text){
  if(!text || !text.trim()) return [];
  // Support pasting a whole block of messages (e.g. copied from WeChat) —
  // each line is parsed independently so one line's date doesn't leak
  // into the next unrelated line.
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(lines.length > 1){
    let all = [];
    lines.forEach(line=>{ all = all.concat(parseQuickLine(line)); });
    return all;
  }
  return parseQuickLine(text);
}
function parseQuickLine(text){
  if(!text || !text.trim()) return [];
  const dateTokens = [];
  const dateOriginalText = [];
  let masked = text.replace(/下[週周]([一二三四五六日天])|今天|明天|後天|后天|(\d{1,2})[\/月](\d{1,2})[日号]?/g, (m, wd, mo, da)=>{
    let resolved = null;
    if(wd) resolved = nextWeekdayDate(wd);
    else if(m==='今天') resolved = todayStr();
    else if(m==='明天') resolved = nextBusinessDay(todayStr());
    else if(m==='後天'||m==='后天') resolved = addDays(todayStr(),2);
    else if(mo && da){
      let y = parseDate(todayStr()).getFullYear();
      resolved = `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
    }
    if(!resolved) return m;
    dateTokens.push(resolved);
    dateOriginalText.push(m);
    return `§D${dateTokens.length-1}§`;
  });

  const idMatches = [];
  const idRe = /\d{1,4}/g;
  let m;
  while((m = idRe.exec(masked))){
    if(getClient(m[0])) idMatches.push({id:m[0], index:m.index, len:m[0].length});
  }
  if(!idMatches.length) return [];

  function cleanText(seg){
    return seg.replace(/§D(\d+)§/g, (_,n)=>dateOriginalText[Number(n)]||'').trim();
  }

  const results = [];
  let lastDate = todayStr();
  for(let i=0;i<idMatches.length;i++){
    const start = idMatches[i].index + idMatches[i].len;
    const end = (i+1<idMatches.length) ? idMatches[i+1].index : masked.length;
    const segment = masked.slice(start, end);
    const clientId = idMatches[i].id;

    const dateMatch = segment.match(/§D(\d+)§/);
    let date = lastDate;
    if(dateMatch){ date = dateTokens[Number(dateMatch[1])]; lastDate = date; }

    const client = getClient(clientId);
    if(!client) continue;
    const readableSegment = cleanText(segment);

    const isLeave = /不來|不来|請假|请假/.test(segment);
    const isCome = !isLeave && /來|来|加開|加开|到訪|到访/.test(segment);
    const driverMatch = segment.match(/[换換][^\d§]{0,6}?(师傅|司机|師傅|司機)/);
    let driverOverride = '';
    if(driverMatch){
      const raw = driverMatch[0].replace(/^[换換]/,'').trim();
      const found = KNOWN_DRIVERS.find(d=>raw.includes(d.replace(/师傅|師傅/,'')) || d===raw);
      driverOverride = found || raw;
    }
    const transportMatch = segment.match(/自駕|自驾|Uber|uber/);
    const selfNoteMatch = segment.match(/自己回去|自己回家|自己來|自己来|自己過來|自己过来/);

    if(isLeave){
      results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'leave', note: readableSegment, rawSegment: readableSegment});
    } else if(isCome){
      const wd = weekdayKeyOf(date);
      const alreadyBaseline = wd && client.baselineDays.includes(wd);
      if(!alreadyBaseline){
        results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'extra', note: readableSegment, rawSegment: readableSegment});
      } else {
        results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'info', note:'原本就排班，不需異動', rawSegment: readableSegment});
      }
    }

    if(driverOverride || transportMatch || selfNoteMatch){
      const entry = {id:uid(), clientId, clientName:clientLabel(client), date, type:'adjust', rawSegment: readableSegment};
      if(driverOverride) entry.driverOverride = driverOverride;
      if(transportMatch){
        entry.transportOverride = 'uber_self';
        entry.subModeOverride = /uber/i.test(transportMatch[0]) ? 'Uber' : '自駕';
      }
      entry.note = readableSegment;
      results.push(entry);
    }

    if(!isLeave && !isCome && !driverOverride && !transportMatch && !selfNoteMatch && segment.trim()){
      results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'unrecognized', note: readableSegment, rawSegment: readableSegment});
    }
  }
  return results;
}

async function applyQuickResults(results){
  let changed = false;
  for(const r of results){
    if(r.type==='leave'){
      addException(r.date, {clientId:r.clientId, type:'leave', note:'快速輸入：'+r.rawSegment});
      changed = true;
    } else if(r.type==='extra'){
      addException(r.date, {clientId:r.clientId, type:'extra', note:'快速輸入：'+r.rawSegment});
      changed = true;
    } else if(r.type==='adjust'){
      if(EXCEPTIONS[r.date]){
        EXCEPTIONS[r.date] = EXCEPTIONS[r.date].filter(e=>!(e.type==='adjust' && e.clientId===r.clientId));
      }
      const entry = {clientId:r.clientId, type:'adjust', note:'快速輸入：'+r.rawSegment};
      if(r.driverOverride) entry.driverOverride = r.driverOverride;
      if(r.transportOverride) entry.transportOverride = r.transportOverride;
      if(r.subModeOverride) entry.subModeOverride = r.subModeOverride;
      addException(r.date, entry);
      changed = true;
    }
  }
  if(changed) await saveExceptions();
  return changed;
}

/* =========================================================
   Driver recommendation by address (based on existing driver service areas)
   ========================================================= */
let DRIVER_CITY_MAP = null;
function loadDriverCityMap(){
  if(DRIVER_CITY_MAP) return DRIVER_CITY_MAP;
  try{
    const el = document.getElementById('driver-city-map');
    DRIVER_CITY_MAP = el ? JSON.parse(el.textContent) : {cities:[], cityDriverRank:{}};
  }catch(e){ DRIVER_CITY_MAP = {cities:[], cityDriverRank:{}}; }
  return DRIVER_CITY_MAP;
}
function extractStreetKey(address){
  if(!address) return '';
  // Strip leading house number, keep the street name portion, normalize for comparison.
  let s = address.trim().toLowerCase();
  s = s.replace(/^[\d\-]+\s*/, ''); // remove leading house number
  // Drop periods before cutting on punctuation — otherwise an abbreviated
  // direction/street type like "S." or "Ave." truncates the key to almost
  // nothing (e.g. "S. San Antonio Ave" would cut down to just "s").
  s = s.replace(/\./g, '');
  s = s.replace(/[,#].*$/, '');    // cut off at first comma/unit-marker
  s = s.replace(/\b(unit|apt|ste|suite|#)\b.*/,'');
  s = s.replace(/\s+/g,' ').trim();
  return s;
}

function suggestDriversForAddress(address, excludeClientId){
  if(!address || !address.trim()) return {city:null, drivers:[], exactMatches:[]};

  // 1) Strongest signal: someone already on (very close to) the same street already has a driver.
  //    Grouping people on the same street with the same driver keeps routes efficient.
  const streetKey = extractStreetKey(address);
  let exactMatches = [];
  if(streetKey && streetKey.length>=5){
    const seen = new Set();
    CLIENTS.forEach(c=>{
      if(c.id===excludeClientId) return;
      if(c.status!=='active' || c.transportMode!=='company' || !c.driver) return;
      const otherKey = extractStreetKey(c.address);
      if(otherKey && otherKey===streetKey && !seen.has(c.driver)){
        seen.add(c.driver);
        exactMatches.push({driver:c.driver, matchedWith:clientLabel(c)});
      }
    });
  }

  // 2) Fallback / secondary signal: general city-level history.
  const map = loadDriverCityMap();
  const lower = address.toLowerCase();
  const sortedCities = [...map.cities].sort((a,b)=>b.length-a.length);
  const found = sortedCities.find(city=>lower.includes(city.toLowerCase()));
  const cityDrivers = found ? (map.cityDriverRank[found] || []) : [];

  return {city:found, drivers:cityDrivers, exactMatches};
}

// Which city/cities a driver actually serves, computed live from their
// current client roster (not the static seed map above, which goes stale
// whenever drivers get reassigned) — used to label drivers by region.
function getDriverRegionLabel(driverName){
  const cities = loadDriverCityMap().cities;
  const sortedCities = [...cities].sort((a,b)=>b.length-a.length);
  const counts = {};
  CLIENTS.forEach(c=>{
    if(c.status!=='active' || c.transportMode!=='company' || c.driver!==driverName) return;
    const lower = (c.address||'').toLowerCase();
    const found = sortedCities.find(city=>lower.includes(city.toLowerCase()));
    if(found) counts[found] = (counts[found]||0)+1;
  });
  const ranked = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  return ranked.slice(0,2).join('／');
}

// Live driver workload, recalculated from current CLIENTS every time (not baked seed data),
// so it stays accurate as members are added/removed/reassigned.
function getDriverLoad(driverName){
  return CLIENTS.filter(c=>c.status==='active' && c.transportMode==='company' && c.driver===driverName).length;
}
function getAllDriverLoads(){
  const loads = {};
  CLIENTS.forEach(c=>{
    if(c.status==='active' && c.transportMode==='company' && c.driver){
      loads[c.driver] = (loads[c.driver]||0)+1;
    }
  });
  return loads;
}
function overloadThreshold(){
  const loads = getAllDriverLoads();
  const vals = Object.values(loads);
  if(!vals.length) return Infinity;
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  return avg*1.4; // ~40% above the average driver's load counts as "likely full"
}

// Dedicated parser for the "auto-detect from note" flow: since the client is already known,
// this scans for EVERY date mention in the text (not just the first) and classifies each as
// either an absence (不來/請假 → leave) or an attendance confirmation (來/會來 → extra, but only
// when that weekday isn't already part of their normal baseline schedule).
function parseNoteForScheduleChanges(clientId, noteText){
  const results = [];
  if(!noteText) return results;
  const client = getClient(clientId);
  const re = /下[週周]([一二三四五六日天])|今天|明天|後天|后天|(\d{1,2})[\/月](\d{1,2})[日号]?/g;
  let m;
  while((m = re.exec(noteText))){
    let resolved = null;
    if(m[1]) resolved = nextWeekdayDate(m[1]);
    else if(m[0]==='今天') resolved = todayStr();
    else if(m[0]==='明天') resolved = nextBusinessDay(todayStr());
    else if(m[0]==='後天'||m[0]==='后天') resolved = addDays(todayStr(),2);
    else if(m[2] && m[3]){
      const y = parseDate(todayStr()).getFullYear();
      resolved = `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    }
    if(!resolved) continue;
    const windowText = noteText.slice(m.index, m.index + m[0].length + 15);
    if(/不來|不来|請假|请假/.test(windowText)){
      results.push({date:resolved, type:'leave'});
    } else if(/來|来|加開|加开|到訪|到访/.test(windowText)){
      const wd = weekdayKeyOf(resolved);
      const alreadyBaseline = client && wd && client.baselineDays.includes(wd);
      if(!alreadyBaseline){
        results.push({date:resolved, type:'extra'});
      }
      // if it's already part of their normal baseline, no exception is needed —
      // they're scheduled that day by default already.
    }
  }
  return results;
}

async function suspendSchedule(clientId){

    async ()=>{

      await saveClients();
      showToast(`已將 ${clientLabel(c)} 標記為長期停班`);

      openMemberModal(clientId);

async function resumeSchedule(clientId){

  openMemberModal(clientId);
  render();
}

let excCalendarDate = null;
let excCalendarEndDate = null;
const EXC_PICKERS = {
  start: {btnId:'f_exc_date_btn', panelId:'f_exc_calendar', viewMonth:null, emptyLabel:'請選擇日期', get(){ return excCalendarDate; }, set(d){ excCalendarDate = d; }},
  end:   {btnId:'f_exc_end_date_btn', panelId:'f_exc_end_calendar', viewMonth:null, emptyLabel:'不設定（只標記一天）', get(){ return excCalendarEndDate; }, set(d){ excCalendarEndDate = d; }}
};
function toggleExcCalendar(evt){ toggleExcPicker('start', evt); }
function toggleExcEndCalendar(evt){ toggleExcPicker('end', evt); }
function toggleExcPicker(key, evt){
  if(evt) evt.stopPropagation();
  const cfg = EXC_PICKERS[key];
  const panel = document.getElementById(cfg.panelId);
  if(!panel) return;
  const isOpen = panel.style.display === 'block';
  if(isOpen){
    panel.style.display = 'none';
    document.removeEventListener('click', closeExcCalendarOnOutsideClick);
    return;
  }
  const base = cfg.get() || excCalendarDate || new Date();
  cfg.viewMonth = {year: base.getFullYear(), month: base.getMonth()};
  renderExcCalendar(key);
  panel.style.display = 'block';
  positionFixedPanel(document.getElementById(cfg.btnId), panel);
  setTimeout(()=> document.addEventListener('click', closeExcCalendarOnOutsideClick), 0);
}
// The member-edit modal scrolls (.modal{overflow:auto}), which clips any
// position:absolute dropdown inside it once the modal is scrolled — the
// dropdown (or parts of it, like its nav arrows) can render outside the
// modal's visible/clickable area. position:fixed placed via the trigger
// button's real screen coordinates avoids that entirely.
function positionFixedPanel(btn, panel){
  if(!btn || !panel) return;
  const rect = btn.getBoundingClientRect();
  const panelWidth = panel.offsetWidth || 230;
  const panelHeight = panel.offsetHeight || 260;
  let left = rect.left;
  if(left + panelWidth > window.innerWidth - 8) left = Math.max(8, window.innerWidth - panelWidth - 8);
  let top = rect.bottom + 4;
  if(top + panelHeight > window.innerHeight - 8) top = Math.max(8, rect.top - panelHeight - 4);
  panel.style.left = left+'px';
  panel.style.top = top+'px';
}
function closeExcCalendarOnOutsideClick(e){
  ['start','end'].forEach(key=>{
    const cfg = EXC_PICKERS[key];
    const panel = document.getElementById(cfg.panelId);
    const btn = document.getElementById(cfg.btnId);
    if(panel && panel.style.display==='block' && !panel.contains(e.target) && e.target!==btn){
      panel.style.display = 'none';
    }
  });
  document.removeEventListener('click', closeExcCalendarOnOutsideClick);
}
function renderExcCalendar(key){
  const cfg = EXC_PICKERS[key];
  const panel = document.getElementById(cfg.panelId);
  if(!panel || !cfg.viewMonth) return;
  const {year, month} = cfg.viewMonth;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const selected = cfg.get();
  // Center is closed weekends, so the picker only shows Mon-Fri (5 columns).
  // Skip Sat/Sun entirely rather than rendering them disabled — the grid
  // auto-wraps every 5 weekday cells into a correct row with no gaps.
  let cells = '';
  let started = false;
  for(let d=1; d<=daysInMonth; d++){
    const wd = new Date(year, month, d).getDay();
    if(wd===0 || wd===6) continue;
    if(!started){
      const monIdx = (wd+6)%7; // Mon=0..Fri=4
      for(let i=0;i<monIdx;i++) cells += '<span></span>';
      started = true;
    }
    const isSelected = selected && selected.getFullYear()===year && selected.getMonth()===month && selected.getDate()===d;
    cells += `<span onclick="pickExcDate('${key}',${year},${month},${d})" style="cursor:pointer; padding:6px 0; text-align:center; border-radius:6px; font-size:12.5px; ${isSelected?'background:var(--teal);color:#fff;font-weight:700;':''}">${d}</span>`;
  }
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <button type="button" onclick="shiftExcMonth('${key}',-1,event)" style="all:unset; cursor:pointer; padding:2px 8px; font-size:13px;">←</button>
      <b style="font-size:12.5px;">${year}年${month+1}月</b>
      <button type="button" onclick="shiftExcMonth('${key}',1,event)" style="all:unset; cursor:pointer; padding:2px 8px; font-size:13px;">→</button>
    </div>
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:2px; font-size:10.5px; color:var(--ink-soft); text-align:center; margin-bottom:4px;">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:2px;">${cells}</div>
    ${key==='end' ? `<button type="button" onclick="clearExcEndDate()" style="all:unset; cursor:pointer; font-size:11px; color:var(--ink-soft); margin-top:6px; display:block;">清除結束日期</button>`:''}
  `;
}
function shiftExcMonth(key, delta, evt){
  // Stop this click from bubbling to the document-level outside-click
  // listener: renderExcCalendar() below replaces the panel's innerHTML
  // (including the very button that was clicked) while the click is
  // still bubbling, so by the time the outside-click handler runs,
  // e.target is a detached node the panel no longer contains — it reads
  // as "outside" and closes the panel before the new month ever shows.
  if(evt) evt.stopPropagation();
  const cfg = EXC_PICKERS[key];
  let {year, month} = cfg.viewMonth;
  month += delta;
  if(month<0){month=11; year--;}
  if(month>11){month=0; year++;}
  cfg.viewMonth = {year, month};
  renderExcCalendar(key);
  positionFixedPanel(document.getElementById(cfg.btnId), document.getElementById(cfg.panelId));
}
function pickExcDate(key, year, month, day){
  const cfg = EXC_PICKERS[key];
  cfg.set(new Date(year, month, day));
  const btn = document.getElementById(cfg.btnId);
  if(btn){
    btn.textContent = `${year}年${month+1}月${day}日`;
    btn.style.color = 'var(--ink)';
  }
  const panel = document.getElementById(cfg.panelId);
  if(panel) panel.style.display = 'none';
  document.removeEventListener('click', closeExcCalendarOnOutsideClick);
}
function clearExcEndDate(){
  excCalendarEndDate = null;
  const btn = document.getElementById('f_exc_end_date_btn');
  if(btn){ btn.textContent = '不設定（只標記一天）'; btn.style.color = 'var(--ink-soft)'; }
  const panel = document.getElementById('f_exc_end_calendar');
  if(panel) panel.style.display = 'none';
}
function dateToStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function eachDateInRange(startD, endD){
  const out = [];
  let cur = new Date(startD.getFullYear(), startD.getMonth(), startD.getDate());
  const end = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate());
  while(cur <= end){
    out.push(dateToStr(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()+1);
  }
  return out;
}

    </div>

function toggleTopbarCalendar(key, evt){
  if(evt) evt.stopPropagation();
  const cfg = TOPBAR_PICKERS[key];
  const panel = document.getElementById(`topbarCal_${key}`);
  if(!cfg || !panel) return;
  const isOpen = panel.style.display === 'block';
  if(isOpen){
    panel.style.display = 'none';
    document.removeEventListener('click', closeTopbarCalendarOnOutsideClick);
    return;
  }
  const base = parseDate(cfg.getValue());
  cfg.viewMonth = {year: base.getFullYear(), month: base.getMonth()};
  renderTopbarCalendarPanel(key);
  panel.style.display = 'block';
  setTimeout(()=> document.addEventListener('click', closeTopbarCalendarOnOutsideClick), 0);
}
function closeTopbarCalendarOnOutsideClick(e){
  Object.keys(TOPBAR_PICKERS).forEach(key=>{
    const panel = document.getElementById(`topbarCal_${key}`);
    const btn = document.getElementById(`topbarBtn_${key}`);
    if(panel && panel.style.display==='block' && !panel.contains(e.target) && e.target!==btn){
      panel.style.display = 'none';
    }
  });
  document.removeEventListener('click', closeTopbarCalendarOnOutsideClick);
}
function renderTopbarCalendarPanel(key){
  const cfg = TOPBAR_PICKERS[key];
  const panel = document.getElementById(`topbarCal_${key}`);
  if(!panel || !cfg.viewMonth) return;
  const {year, month} = cfg.viewMonth;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const selectedStr = cfg.getValue();
  // Center is closed weekends, so the picker only shows Mon-Fri (5 columns).
  // Skip Sat/Sun entirely rather than rendering them disabled — the grid
  // auto-wraps every 5 weekday cells into a correct row with no gaps.
  let cells = '';
  let started = false;
  for(let d=1; d<=daysInMonth; d++){
    const wd = new Date(year, month, d).getDay();
    if(wd===0 || wd===6) continue;
    if(!started){
      const monIdx = (wd+6)%7; // Mon=0..Fri=4
      for(let i=0;i<monIdx;i++) cells += '<span></span>';
      started = true;
    }
    const cellStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isSelected = cellStr === selectedStr;
    const isToday = cellStr === todayStr();
    cells += `<span onclick="pickTopbarDate('${key}',${year},${month},${d})" style="cursor:pointer; padding:6px 0; text-align:center; border-radius:6px; font-size:12.5px; ${isSelected?'background:var(--teal);color:#fff;font-weight:700;':(isToday?'border:1px solid var(--teal);':'')}">${d}</span>`;
  }
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <button type="button" onclick="shiftTopbarMonth('${key}',-1,event)" style="all:unset; cursor:pointer; padding:2px 8px; font-size:13px;">←</button>
      <b style="font-size:12.5px;">${year}年${month+1}月</b>
      <button type="button" onclick="shiftTopbarMonth('${key}',1,event)" style="all:unset; cursor:pointer; padding:2px 8px; font-size:13px;">→</button>
    </div>
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:2px; font-size:10.5px; color:var(--ink-soft); text-align:center; margin-bottom:4px;">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:2px;">${cells}</div>
  `;
}
function shiftTopbarMonth(key, delta, evt){
  if(evt) evt.stopPropagation(); // see the comment in shiftExcMonth() — same detached-node bug
  const cfg = TOPBAR_PICKERS[key];
  let {year, month} = cfg.viewMonth;
  month += delta;
  if(month<0){month=11; year--;}
  if(month>11){month=0; year++;}
  cfg.viewMonth = {year, month};
  renderTopbarCalendarPanel(key);
}
function pickTopbarDate(key, year, month, day){
  const cfg = TOPBAR_PICKERS[key];
  const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const panel = document.getElementById(`topbarCal_${key}`);
  if(panel) panel.style.display = 'none';
  document.removeEventListener('click', closeTopbarCalendarOnOutsideClick);
  cfg.setValue(dateStr);
}

function addExceptionEntriesForClient(clientId, dates, type, note, driverOverride){
  let addedCount = 0;
  dates.forEach(date=>{
    const dup = (EXCEPTIONS[date]||[]).some(e=>e.type===type && e.clientId===clientId);
    if(dup) return;
    addException(date, {clientId, type, note});
    if(type==='extra' && driverOverride){
      addException(date, {clientId, type:'adjust', driverOverride, note:'特別來指定司機：'+driverOverride});
    }
    addedCount++;
  });
  return addedCount;
}
async function addHistEntryFromModal(type){
  const idInput = document.getElementById('f_id');
  const noteInput = document.getElementById('f_exc_note');
  const driverSelect = document.getElementById('f_exc_driver');
  const linkSpouseCheckbox = document.getElementById('f_exc_linkSpouse');
  if(!idInput) return;
  const clientId = idInput.value;
  if(!excCalendarDate){ showToast('請先選擇日期'); return; }
  const note = noteInput ? noteInput.value.trim() : '';
  const driverOverride = driverSelect ? driverSelect.value : '';

  let dates = [dateToStr(excCalendarDate)];
  if(type==='leave' && excCalendarEndDate){
    if(excCalendarEndDate < excCalendarDate){ showToast('結束日期不能早於開始日期'); return; }
    dates = eachDateInRange(excCalendarDate, excCalendarEndDate);
  }

  let addedCount = addExceptionEntriesForClient(clientId, dates, type, note, driverOverride);

  const c = getClient(clientId);
  const spouseId = getSpouseId(c);
  let spouseAdded = 0;
  let spouse = null;
  if(spouseId && linkSpouseCheckbox && linkSpouseCheckbox.checked){
    spouse = getClient(spouseId);
    if(spouse){
      // extra-with-driver defaults to the spouse's OWN driver, not the primary member's chosen driver,
      // unless a driver was explicitly picked (then apply the same override to both).
      spouseAdded = addExceptionEntriesForClient(spouseId, dates, type, note, driverOverride);
    }
  }

  if(!addedCount && !spouseAdded){ showToast('這些日期已經有相同的紀錄了'); return; }

  await saveExceptions();
  const listEl = document.getElementById('historyList');
  if(listEl) listEl.innerHTML = renderHistoryList(clientId);
  if(noteInput) noteInput.value = '';
  if(driverSelect) driverSelect.value = '';
  excCalendarDate = null;
  excCalendarEndDate = null;
  const btn = document.getElementById('f_exc_date_btn');
  if(btn){ btn.textContent = '請選擇日期'; btn.style.color = 'var(--ink-soft)'; }
  const endBtn = document.getElementById('f_exc_end_date_btn');
  if(endBtn){ endBtn.textContent = '不設定（只標記一天）'; endBtn.style.color = 'var(--ink-soft)'; }
  const dayWord = addedCount>1 ? `共 ${addedCount} 天` : '';
  const spouseWord = spouseAdded ? `，也一併標記配偶「${clientLabel(spouse)}」` : '';
  showToast((type==='leave' ? `已標記請假${dayWord}` : `已標記特別來${dayWord}，已自動排入司機路線`) + spouseWord + '並自動存檔');
  render();
}

async function saveMemberModal(isNew){
  const id = document.getElementById('f_id').value.trim();
  if(!id){ showToast('請輸入會員編號'); return; }
  const originalIdInput = document.getElementById('f_id_original');
  const originalId = originalIdInput ? originalIdInput.value : id;
  const idChanged = !isNew && id !== originalId;
  if((isNew || idChanged) && getClient(id)){ showToast('此編號已存在'); return; }

  const days = Array.from(document.querySelectorAll('#f_days .driver-chip.active')).map(el=>el.dataset.day);
  const obj = {
    id,
    enName: document.getElementById('f_en').value.trim(),
    cnName: document.getElementById('f_cn').value.trim(),
    address: document.getElementById('f_addr').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    baselineDays: days,
    transportMode: document.getElementById('f_transport').value,
    driver: (()=>{
      const sel = document.getElementById('f_driver').value;
      return sel === '__other__' ? (document.getElementById('f_driver_other').value||'').trim() : sel;
    })(),
    dietary: document.getElementById('f_diet').value.trim(),
    relationship: document.getElementById('f_rel').value.trim(),
    visitor: document.getElementById('f_visitor').checked,
    ers: document.getElementById('f_ers').checked,
    ersPickup: document.getElementById('f_ersPickup').checked,
    insuranceDaysPerWeek: Number(document.getElementById('f_insdays').value)||0,
    bossApprovedDays: Number(document.getElementById('f_bossdays').value)||0,
    status: document.getElementById('f_status').value,
    subMode: document.getElementById('f_submode').value,
    note: document.getElementById('f_note').value.trim(),
  };

  if(isNew){
    CLIENTS.push(obj);
  } else {
    const idx = CLIENTS.findIndex(c=>c.id===originalId);
    if(idx===-1){ showToast('找不到原本的會員資料，儲存失敗'); return; }
    CLIENTS[idx] = obj;
    if(idChanged){
      // 編號改變了，連帶把歷史紀錄（請假/加開等）裡的會員編號也一起更新，避免對不起來
      Object.keys(EXCEPTIONS).forEach(date=>{
        (EXCEPTIONS[date]||[]).forEach(e=>{ if(e.clientId===originalId) e.clientId = id; });
      });
    }
  }
  await saveClients();
  if(idChanged){
    await saveExceptions();
  }

  // Auto-detect schedule changes mentioned in the note (e.g. "周一請假,周二會來")
  // and automatically create/update the matching exceptions — no separate confirmation needed.
  // Skip anything that already has a matching exception for this client+date, so re-saving the
  // same note (e.g. after editing an unrelated field) doesn't create duplicate records.
  const changes = parseNoteForScheduleChanges(id, obj.note||'').filter(r=>{
    return !(EXCEPTIONS[r.date]||[]).some(e=>e.type===r.type && e.clientId===id);
  });

  // Visitor's optional "coming to visit on this date" field — add them
  // straight to that day's schedule so staff don't have to go do it
  // separately on the daily schedule page. Available both for brand-new
  // visitors and when re-opening an existing visitor's record later to
  // add another visit date.
  const visitDateInput = document.getElementById('f_visit_date');
  const visitDate = visitDateInput ? visitDateInput.value : '';
  let visitDateAdded = false;
  if(visitDate && !(EXCEPTIONS[visitDate]||[]).some(e=>e.type==='extra' && e.clientId===id)){
    addException(visitDate, {clientId:id, type:'extra', note:'新訪客參觀體驗'});
    visitDateAdded = true;
  }

  // The visit-date exception only puts this visitor on the day's general
  // schedule list — printSignIn/printUberWaiver and the driver route sheet
  // all filter by transportMode, so a visitor with no transport mode set
  // silently never appears on those, even though the exception saved fine.
  const noTransportWarning = (visitDateAdded && !obj.transportMode)
    ? '　⚠ 未設定接送方式，這位訪客不會出現在簽到表或司機路線表，只會出現在每日排班的名單裡'
    : '';

  if(changes.length || visitDateAdded){
    changes.forEach(r=>{
      addException(r.date, {clientId:id, type:r.type, note:'依備註自動偵測：'+obj.note});
    });
    await saveExceptions();
    const leaveCount = changes.filter(r=>r.type==='leave').length;
    const extraCount = changes.filter(r=>r.type==='extra').length + (visitDateAdded?1:0);
    const parts = [];
    if(leaveCount) parts.push(`${leaveCount} 筆請假`);
    if(extraCount) parts.push(`${extraCount} 筆加開`);
    showToast(`已儲存，並自動偵測到 ${parts.join('、')}${noTransportWarning}`, noTransportWarning ? 6000 : 2200);
  } else {
    showToast('已儲存');
  }

  if(isNew){
    // A brand-new record's form doesn't have the leave/special-visit
    // exception tools or the delete button (they need an existing
    // record to attach to) — reopen once, now in "editing" mode, so
    // those become available. This only happens on the very first save.
    closeMemberModal();
    openMemberModal(id);
  } else {
    // Keep the modal open exactly as it is (no close/reopen — that used
    // to cause a visible flash and reset scroll position/focus) so staff
    // can keep editing the same record continuously and close it
    // themselves whenever they're actually done. Just sync the hidden
    // "original id" field in case the ID changed, and clear the
    // unsaved-changes flag.
    if(originalIdInput) originalIdInput.value = id;
    window.__memberModalDirty = false;
  }
  render();
}

function filterScheduleRows(query){

  const rows = document.querySelectorAll('#scheduleTbody tr');
  let visible = 0;
  rows.forEach(row=>{

    const match = !q || hay.includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  const counter = document.getElementById('schedVisibleCount');
  if(counter) counter.textContent = visible;
}

/* =========================================================
   Weekly fixed roster (週一～五固定班表總覽)
   A week-at-a-glance view of who's normally scheduled each weekday
   (baselineDays), so staff can see the default pattern for the whole
   week in one place. Clicking a name crosses it out (marks leave for
   that specific date); the "+ 加開" control on each day adds someone
   extra for just that date. Both reuse the same EXCEPTIONS-based
   leave/extra mechanism as the daily schedule page — this is just a
   different (by-weekday, not by-single-date) view onto it.
   ========================================================= */
let weeklyMonday = mondayOf(todayStr());

function setWeeklyWeek(offsetWeeks){
  const base = weeklyMonday || mondayOf(todayStr());
  const d = parseDate(base);
  d.setDate(d.getDate() + offsetWeeks*7);
  weeklyMonday = ymd(d);
  render();
}
function setWeeklyThisWeek(){
  weeklyMonday = mondayOf(todayStr());
  render();
}

function buildWeeklyDayData(dateStr){
  const wd = weekdayKeyOf(dateStr);
  const dayExceptions = EXCEPTIONS[dateStr] || [];
  const leaveByClient = {};
  dayExceptions.filter(e=>e.type==='leave').forEach(e=>{ leaveByClient[e.clientId] = e; });
  const extraEntries = dayExceptions.filter(e=>e.type==='extra');

  const baselineClients = CLIENTS.filter(c=>c.status==='active' && !c.ers && c.baselineDays.includes(wd));
  const baselineIds = new Set(baselineClients.map(c=>c.id));
  const baseline = sortWithCouplesGrouped(baselineClients.map(c=>({client:c}))).map(x=>x.client);

  const extras = extraEntries
    .filter(e=>!baselineIds.has(e.clientId))
    .map(e=>({exc:e, client:getClient(e.clientId)}))
    .filter(x=>x.client);

  return {wd, baseline, leaveByClient, extras};
}

// Sign-in-style print sheets (as opposed to the admission packet / driver
// route sheet, which keep their own carefully-tuned fonts) use Aptos
// Display for Latin text, falling back to the Chinese font for CJK glyphs
// Aptos Display doesn't cover.
const SIGN_IN_FONT_TAG = `<style>.print-page-inner{font-family:'Aptos Display','Noto Sans TC','Helvetica Neue',Arial,sans-serif;}</style>`;

// A small extra inset beyond the @page 10mm margin, applied as real padding
// on the print surface (see the print-preview-pane print-media rule) — a
// table's outer border sitting exactly flush with the page's margin box has
// no room for error, and real printers/PDF engines can clip a line that
// sits right at that edge (headless/on-screen rendering doesn't show this,
// since it's pixel-perfect in a way physical printers aren't). Subtracted
// from the usable dimensions below so the live row/column measurement
// matches what's actually rendered.
const PRINT_SAFE_INSET_PX = 8; // ~2mm
const A4_PORTRAIT_USABLE_WIDTH_PX = (210-20)*96/25.4 - PRINT_SAFE_INSET_PX*2;   // A4, 10mm margins each side
const A4_PORTRAIT_USABLE_HEIGHT_PX = (297-20)*96/25.4 - PRINT_SAFE_INSET_PX*2;

// Hardcoding a rows-per-page constant from an isolated measurement doesn't
// hold up: the actual print rendering always goes through the in-page
// preview pane (window.open() is blocked in this sandboxed environment),
// which inherits the live app's own fonts/line-height, and those can still
// vary in ways a one-off measurement misses. So instead we measure the
// REAL rendered title box + thead + one data row, live, in the browser
// that's about to print, right before paginating — self-correcting
// regardless of exactly what's actually rendering. This is safe to do here
// (unlike an earlier attempt at dynamic pagination that broke printing
// entirely): it runs as a normal function call before the preview pane is
// shown, not as a <script> tag embedded in the innerHTML string handed to
// openPrintableDoc/openAndPrintDoc — scripts inserted that way never
// execute, and there's no auto-triggered window.print() here to race
// against since this path always waits for the person to press Ctrl/⌘+P.
function measureRowMetrics({titleBoxHtml, theadHtml, rowHtml, tableClass, extraStyle, usableWidth, orientation}){
  const container = document.createElement('div');
  container.style.cssText = `position:fixed; left:-9999px; top:0; width:${usableWidth}px; visibility:hidden; font-family:'Aptos Display','Noto Sans TC','Helvetica Neue',Arial,sans-serif; line-height:normal;`;
  container.innerHTML = `${extraStyle||''}${titleBoxHtml||''}<table class="${tableClass}"><colgroup></colgroup>${theadHtml}<tbody>${rowHtml}${rowHtml}</tbody></table>`;
  document.body.appendChild(container);
  let overhead, rowHeight;
  try{
    const containerTop = container.getBoundingClientRect().top;
    const rows = container.querySelectorAll('tbody tr');
    if(rows.length >= 2){
      const row0Top = rows[0].getBoundingClientRect().top;
      const row1Top = rows[1].getBoundingClientRect().top;
      overhead = row0Top - containerTop;
      rowHeight = row1Top - row0Top;
    }
  }catch(e){ /* fall through to defaults below */ }
  document.body.removeChild(container);
  if(!(overhead > 0) || !(rowHeight > 0)){ overhead = 150; rowHeight = 40; } // safe fallback if measurement ever fails
  return {overhead, rowHeight};
}

// Computes rowsPerPage for buildFillPagedSheet from a live measurement —
// safetyMarginPx trims a bit off the usable height so a rounding-level
// mismatch between this measurement and the browser's own print
// pagination can't push the last row onto a wasted extra page.
function computeRowsPerPage({titleBoxHtml, theadHtml, rowHtml, tableClass, extraStyle}, safetyMarginPx){
  const {overhead, rowHeight} = measureRowMetrics({
    titleBoxHtml, theadHtml, rowHtml, tableClass, extraStyle,
    usableWidth: A4_PORTRAIT_USABLE_WIDTH_PX,
  });
  const usable = A4_PORTRAIT_USABLE_HEIGHT_PX - (safetyMarginPx==null?20:safetyMarginPx);
  return Math.max(5, Math.floor((usable - overhead) / rowHeight));
}

// Shared pattern for sign-in/roster print sheets: split rows into explicit
// per-page tables (own title box + full <thead> repeated on every page,
// since browsers don't reliably repeat a table's own <thead> across natural
// pagination), with enough trailing blank rows added so the LAST page's
// table always extends exactly to the bottom of the printable page — no
// print/PDF output should ever show an unbordered blank area, every leftover
// space is more blank table rows. rowsPerPage is computed live via
// computeRowsPerPage() by each caller, not guessed — see each caller.
//
// The full titleBoxHtml (padded color box, date, headcount) only needs to
// appear once, on page 1 — repeating it in full on every continuation page
// eats rows-per-page and pushes the sheet onto more physical pages than
// necessary. Callers that pass contTitleBoxHtml/rowsPerPageCont get a
// slimmer repeated header on pages 2+ instead, computed from its own
// (smaller) live measurement; omitting them keeps the old uniform behavior.
function buildFillPagedSheet({titleBoxHtml, contTitleBoxHtml, theadHtml, contTheadHtml, colCount, rowsPerPage, rowsPerPageCont, realRows, rowHtml, noticeHtml, extraTableClass, blankRowHeight}){
  const blankRowHtml = `<tr style="height:${blankRowHeight||28}px;">${Array.from({length:colCount}).map(()=>'<td>&nbsp;</td>').join('')}</tr>`;
  const noticeRows = realRows.length ? [] : [{notice:true}];
  const content = [...noticeRows, ...realRows];
  const capFirst = rowsPerPage;
  const capCont = rowsPerPageCont || rowsPerPage;
  const pages = [];
  let idx = 0;
  do{
    const cap = pages.length===0 ? capFirst : capCont;
    pages.push(content.slice(idx, idx+cap));
    idx += cap;
  }while(idx < content.length);
  if(!pages.length) pages.push([]);
  const lastCap = pages.length===1 ? capFirst : capCont;
  const fillCount = lastCap - pages[pages.length-1].length;
  for(let k=0;k<fillCount;k++) pages[pages.length-1].push({blank:true});
  const renderRow = r => r.notice ? noticeHtml : (r.blank ? blankRowHtml : rowHtml(r));
  return `
    <style>.wp-page{page-break-after:always;} .wp-page:last-child{page-break-after:auto;}</style>
    ${pages.map((pageRows, pi) => `
      <div class="wp-page">
        ${pi===0 ? titleBoxHtml : (contTitleBoxHtml || titleBoxHtml)}
        <table class="sig-table wp-table${extraTableClass ? ' '+extraTableClass : ''}">
          ${pi===0 ? theadHtml : (contTheadHtml || theadHtml)}
          <tbody>${pageRows.map(renderRow).join('')}</tbody>
        </table>
      </div>
    `).join('')}`;
}

// Same live-measurement idea as computeRowsPerPage, adapted for
// buildFillPagedGroupedSheet's three quantities: the doc title block
// (page 1 only), one group's own header+thead bar, and one data row.
// headerHtmlSample must be a real group.headerHtml(false) call (it ends
// mid-markup, at an open <tbody>, same as what buildFillPagedGroupedSheet
// itself renders) and rowHtmlSample one real data row's <tr>.
function computeGroupedMetrics({docTitleHtml, headerHtmlSample, rowHtmlSample}){
  const container = document.createElement('div');
  container.style.cssText = `position:fixed; left:-9999px; top:0; width:${A4_PORTRAIT_USABLE_WIDTH_PX}px; visibility:hidden; font-family:'Aptos Display','Noto Sans TC','Helvetica Neue',Arial,sans-serif; line-height:normal;`;
  container.innerHTML = `${docTitleHtml||''}<div id="__gStart">${headerHtmlSample}${rowHtmlSample}${rowHtmlSample}</tbody></table></div>`;
  document.body.appendChild(container);
  let titleHeight, headerHeight, rowHeight;
  try{
    const containerTop = container.getBoundingClientRect().top;
    const startDiv = container.querySelector('#__gStart');
    const startTop = startDiv.getBoundingClientRect().top;
    const rows = startDiv.querySelectorAll('tbody tr');
    if(rows.length >= 2){
      const row0Top = rows[0].getBoundingClientRect().top;
      const row1Top = rows[1].getBoundingClientRect().top;
      titleHeight = startTop - containerTop;
      headerHeight = row0Top - startTop;
      rowHeight = row1Top - row0Top;
    }
  }catch(e){ /* fall through to defaults below */ }
  document.body.removeChild(container);
  if(!(titleHeight >= 0)) titleHeight = 60;
  if(!(headerHeight > 0)) headerHeight = 73.5;
  if(!(rowHeight > 0)) rowHeight = 34;
  return {titleHeight, headerHeight, rowHeight};
}

// Shared pattern for multi-group print sheets — one small table per
// weekday, or per diet category, stacked on the page — where a single
// group's own row count can already span several physical pages on its
// own (e.g. ~100+ people on one weekday). Packs each group's header+rows
// into physical pages using measured heights (not guessed), repeating a
// group's own header/thead — marked "續" — whenever its rows spill onto a
// new page, and padding the LAST page's final table with blank rows down
// to the page bottom so no page ends in an unbordered gap.
function buildFillPagedGroupedSheet({docTitleHtml, titleHeight, groups, colCount, headerHeight, rowHeight, usableHeight}){
  // 1046.9px is the exact usable-page height (A4 portrait, 10mm margins),
  // but packing pages to that exact figure produced occasional stray
  // near-empty extra pages when actually printed to PDF — some rows here
  // carry a free-text "備註" note column that can wrap to 2-3 lines,
  // taller than the single measured baseline row, so a page can end up
  // with more real content than the header/row-count math assumed. A
  // generous ~150px safety margin (measured empirically against real
  // print output with real note text, not just on-screen layout with a
  // short sample row) keeps that from tipping a page over.
  usableHeight = usableHeight || (1046.9 - 150);
  const pages = [[]];
  let remaining = usableHeight - (titleHeight||0);
  groups.forEach(g=>{
    const rows = g.rows.length ? g.rows : [g.noticeHtml];
    let i = 0;
    let isContinuation = false;
    do{
      if(remaining < headerHeight + rowHeight){
        pages.push([]);
        remaining = usableHeight;
      }
      remaining -= headerHeight;
      const segRows = [];
      while(i < rows.length && remaining >= rowHeight){
        segRows.push(rows[i]); remaining -= rowHeight; i++;
      }
      pages[pages.length-1].push({headerHtml: g.headerHtml(isContinuation), rows: segRows});
      isContinuation = true;
    }while(i < rows.length);
  });
  const lastPage = pages[pages.length-1];
  const lastSeg = lastPage[lastPage.length-1];
  const blankCount = Math.max(0, Math.floor(remaining / rowHeight));
  const blankRow = `<tr style="height:28px;">${Array.from({length:colCount}).map(()=>'<td>&nbsp;</td>').join('')}</tr>`;
  for(let k=0;k<blankCount;k++) lastSeg.rows.push(blankRow);

  return `
    <style>.wp-page{page-break-after:always;} .wp-page:last-child{page-break-after:auto;}</style>
    ${pages.map((segs, pi) => `
      <div class="wp-page">
        ${pi===0 && docTitleHtml ? docTitleHtml : ''}
        ${segs.map(seg => `${seg.headerHtml}${seg.rows.join('')}</tbody></table>`).join('')}
      </div>
    `).join('')}`;
}

 }

let __lastPrintDoc = null; // {title, innerHtml} for the "open in new tab" fallback

    const pane = document.getElementById('printPreviewPane');
    if(!pane){ showToast('系統錯誤：找不到預覽區塊，請重新整理頁面'); return; }
    pane.innerHTML = `
      <style>@media print{ @page{ size: A4 ${orientation}; margin: 10mm; } }</style>
      <div class="print-preview-bar no-print" style="flex-direction:column; align-items:stretch; gap:4px;">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
          <span>📄 <b>${escapeHtml(title)}</b> 列印預覽 — 請先點一下下方內容區域，再按 <b>Ctrl+P</b>（Mac：<b>⌘+P</b>）</span>
          <span style="display:flex; gap:8px; flex-shrink:0;">
            <button class="btn sm ghost" onclick="openPrintInNewTab()">↗ 在新分頁開啟</button>
            <button class="btn sm ghost" onclick="closePrintPreview()">✕ 關閉預覽</button>
          </span>
        </div>
        <div style="font-size:12px; opacity:.85;">💡 想拿掉列印最下面的網址／日期：在列印視窗點「更多設定」，把「頁首及頁尾」取消勾選</div>
      </div>
      <div id="printContentClickTarget" tabindex="-1">${innerHtml}</div>
    `;
    // Set both the class (for print-media CSS) AND direct inline styles
    // (so this works even if the class-based cascade is somehow stale/cached).
    document.body.classList.add('print-mode-active');
    pane.style.setProperty('display','block','important');
    const sidebarEl = document.querySelector('.sidebar');
    const mainEl = document.querySelector('.main');
    if(sidebarEl) sidebarEl.style.setProperty('display','none','important');
    if(mainEl) mainEl.style.setProperty('display','none','important');
    try{ window.scrollTo(0,0); }catch(e){ /* non-fatal */ }
    // Try to give the content area actual browser focus, so Cmd/Ctrl+P targets
    // this frame instead of the outer Claude page (when embedded in an iframe).
    try{ document.getElementById('printContentClickTarget')?.focus({preventScroll:true}); }catch(e){}
  }catch(err){
    console.error('openPrintableDoc failed', err);
    showToast('列印預覽發生錯誤：'+(err && err.message ? err.message : err));
  }
}
