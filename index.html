function openPrintInNewTab(){
  if(!__lastPrintDoc){ showToast('沒有可開啟的列印內容'); return; }
  const hint = `🖨 列印前請確認列印視窗的「配置」欄位選的是<b>${__lastPrintDoc.orientation==='portrait'?'直向':'橫向'}</b>（瀏覽器有時會記住上次的設定，需要手動選一次）　｜　想拿掉最下面的網址／日期：點「更多設定」，取消勾選「頁首及頁尾」`;
  const doc = buildPrintDocHtml(__lastPrintDoc, hint);

  // Open a blank tab first (direct result of the click, so it isn't treated as a popup),
  // then write the HTML straight into it. This avoids the browser's "download this blob"
  // heuristic that can trigger when navigating a new tab directly to a blob: URL.
  const win = window.open('', '_blank');
  if(!win){
    // Popup fully blocked — fall back to a real download so the person can still get the content.
    const blob = new Blob([doc], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${__lastPrintDoc.title}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    showToast('瀏覽器擋住了新分頁，已改為下載檔案，請打開後列印');
    return;
  }
  win.document.open();
  win.document.write(doc);
  win.document.close();
  try{ win.focus(); }catch(e){}
  showToast('已在新分頁開啟，請在該分頁按 Ctrl+P／⌘+P 列印');
}

// Opens the doc in a real (non-sandboxed) browser tab and triggers the
// print dialog immediately — no manual Ctrl+P step. Used where a single
// click should go straight to printing.
function openAndPrintDoc(title, innerHtml, orientation){
  orientation = orientation || 'landscape';
  try{
    const printDoc = {title, innerHtml, orientation};
    __lastPrintDoc = printDoc;
    const hint = `想拿掉列印最下面的網址／日期：在列印視窗點「更多設定」，取消勾選「頁首及頁尾」`;
    const doc = buildPrintDocHtml(printDoc, hint);

    const win = window.open('', '_blank');
    if(!win){
      // New tab got blocked (common on mobile browsers, or when this page
      // is embedded inside another site's viewer). A file download isn't
      // a reliable fallback in those same contexts, so fall back to the
      // in-page print preview instead — it works everywhere since it
      // doesn't need a new window at all.
      showToast('瀏覽器擋住了新分頁，改用頁面內列印預覽');
      openPrintableDoc(title, innerHtml, orientation);
      return;
    }
    win.document.open();
    win.document.write(doc);
    win.document.close();
    try{ win.focus(); }catch(e){}
    // Give the new tab a moment to finish laying out before printing.
    setTimeout(()=>{ try{ win.print(); }catch(e){ showToast('已開啟列印分頁，請按 Ctrl+P／⌘+P 列印'); } }, 300);
  }catch(err){
    console.error('openAndPrintDoc failed', err);
    showToast('列印時發生錯誤：'+(err && err.message ? err.message : err));
  }
}

function idCompare(idA, idB){
  const aV = typeof idA==='string' && idA.charAt(0)==='V';
  const bV = typeof idB==='string' && idB.charAt(0)==='V';
  if(aV !== bV) return aV ? 1 : -1;
  const an = Number(idA), bn = Number(idB);
  const aNum = !isNaN(an), bNum = !isNaN(bn);
  if(aNum && bNum) return an - bn;
  if(aNum !== bNum) return aNum ? -1 : 1;
  return String(idA).localeCompare(String(idB));
}

// Sorts a scheduled list so married couples (relationship contains "夫妻")
// sit next to each other, ordered by the lower ID in each couple; everyone
// else (and any couple whose partner isn't scheduled today) falls back to
// plain ID order.
function sortWithCouplesGrouped(schedArr){
  const scheduledIds = new Set(schedArr.map(x=>x.client.id));
  function explicitPartnerId(client){
    const rel = client.relationship || '';
    if(!/夫妻/.test(rel)) return null;
    const selfEsc = String(client.id).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let m = rel.match(new RegExp(selfEsc+'\\/([^\\s·]+?)夫妻'));
    if(m) return m[1];
    m = rel.match(new RegExp('([^\\s·]+?)\\/'+selfEsc+'夫妻'));
    if(m) return m[1];
    return null;
  }
  // Fallback for couples noted without an explicit "ID/ID夫妻" pair
  // (e.g. "131的朋友，夫妻") — group anyone scheduled today who shares
  // that exact relationship text.
  const relTextGroups = {};
  schedArr.forEach(x=>{
    const rel = (x.client.relationship||'').trim();
    if(rel && /夫妻/.test(rel) && !explicitPartnerId(x.client)){
      (relTextGroups[rel] = relTextGroups[rel]||[]).push(x.client.id);
    }
  });
  const groupMinRank = {};
  schedArr.forEach(x=>{
    let ids = [x.client.id];
    const partnerId = explicitPartnerId(x.client);
    if(partnerId && scheduledIds.has(partnerId)) ids.push(partnerId);
    const rel = (x.client.relationship||'').trim();
    if(rel && relTextGroups[rel] && relTextGroups[rel].length>1) ids = relTextGroups[rel];
    groupMinRank[x.client.id] = ids.reduce((min,id)=> idCompare(id,min)<0 ? id : min, ids[0]);
  });
  return schedArr.slice().sort((a,b)=>{
    const gc = idCompare(groupMinRank[a.client.id], groupMinRank[b.client.id]);
    if(gc !== 0) return gc;
    return idCompare(a.client.id, b.client.id);
  });
}

function printUberWaiver(){
 try{
  const sched = sortWithCouplesGrouped(
    getScheduledForDate(scheduleDate).filter(x=>x.client.transportMode==='uber_self')
  );
  const WAIVER_TEXT = `
    I, the participant listed, understand that the center has arranged inclusive transportation services, but I consent to
    waive today's transportation services due to unforeseen personal and/or emergency reasons. By signing below, I fully
    waive and release GENTLE HEART DAYCARE CENTER, and its employees from all liability, injuries or loss arising out of,
    connected with, or in any way associated with my choice of transportation.
  `;
  const titleBoxHtml = `<div style="background:#EDEAE1; color:#2B2620; padding:16px 20px; border-radius:8px; text-align:center; margin-bottom:16px;">
      <div class="print-title" style="color:#2B2620; margin-bottom:4px;">Gentle Heart Daycare Center Transportation Waiver</div>
      <div style="font-size:16px; font-weight:800; letter-spacing:.02em; color:#8C4B32; margin-bottom:6px;">📅 ${fmtDateEnglish(scheduleDate)}</div>
      <div class="print-sub" style="color:#5A5347; margin-bottom:0;">Self-Drive / Uber — ${sched.length} Expected</div>
    </div>`;
  // Slimmer repeated header for page 2+ — the full padded title box (and
  // the legal waiver paragraph, which only needs to be read once) eat rows
  // on every page if repeated in full, pushing the sheet onto more physical
  // pages than the row count actually needs.
  const contTitleBoxHtml = `<div style="display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid #8C6318; padding-bottom:4px; margin-bottom:10px;">
      <span style="font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px; color:#2B2620;">Gentle Heart Daycare Center Transportation Waiver（續 continued）</span>
      <span style="font-size:13px; color:#5A5347;">${fmtDateEnglish(scheduleDate)}　Self-Drive / Uber</span>
    </div>`;
  // See printSignIn's comment: fix the ID column to a strict width and
  // clip (rather than wrap) long IDs so every row stays exactly one line
  // tall — the fill-to-bottom math below assumes uniform row height.
  const idColStyleTag = `<style>
    .id-cell{white-space:nowrap; max-width:90px; overflow:hidden; text-overflow:ellipsis; font-size:11px;}
    table.sig-table thead th{white-space:nowrap;}</style>`;
  const theadHtml = `<thead>
      <tr><td colspan="7" style="border:none; padding:0 0 12px; font-size:13px; color:#333; line-height:1.5; font-weight:400; text-align:left;">${WAIVER_TEXT}</td></tr>
      <tr><th class="id-cell">ID</th><th>English Name</th><th>Chinese Name</th><th style="width:60px;">Uber</th><th>Time In</th><th>Time Out</th><th style="width:22%;">Signature</th></tr>
    </thead>`;
  const contTheadHtml = `<thead>
      <tr><th class="id-cell">ID</th><th>English Name</th><th>Chinese Name</th><th style="width:60px;">Uber</th><th>Time In</th><th>Time Out</th><th style="width:22%;">Signature</th></tr>
    </thead>`;
  const realRows = sched.map(x=>({id:x.client.id, en:x.client.enName, cn:x.client.cnName, uber:x.client.subMode==='Uber'?'Uber':''}));
  const rowHtml = r => `<tr>
      <td class="id-cell" title="${escapeHtml(r.id)}">${escapeHtml(r.id)}</td>
      <td>${escapeHtml(r.en)}</td>
      <td>${escapeHtml(r.cn)}</td>
      <td>${escapeHtml(r.uber)}</td>
      <td></td><td></td><td></td>
    </tr>`;
  const sampleRowHtml = rowHtml(realRows[0] || {id:'000', en:'Sample Name', cn:'測試姓名', uber:'Uber'});
  const ROWS_PER_PAGE = computeRowsPerPage({
    titleBoxHtml: idColStyleTag+titleBoxHtml, theadHtml, tableClass:'sig-table fixed-id-col', rowHtml: sampleRowHtml,
  });
  const ROWS_PER_PAGE_CONT = computeRowsPerPage({
    titleBoxHtml: idColStyleTag+contTitleBoxHtml, theadHtml: contTheadHtml, tableClass:'sig-table fixed-id-col', rowHtml: sampleRowHtml,
  });
  const body = buildFillPagedSheet({
    titleBoxHtml: idColStyleTag+titleBoxHtml, contTitleBoxHtml, theadHtml, contTheadHtml, colCount:7,
    rowsPerPage:ROWS_PER_PAGE, rowsPerPageCont:ROWS_PER_PAGE_CONT,
    realRows, rowHtml, extraTableClass:'fixed-id-col',
    noticeHtml: `<tr><td colspan="7" style="text-align:center;color:#777;">No self-drive/Uber participants today</td></tr>`,
  });
  const html = `${SIGN_IN_FONT_TAG}${body}`;
  openAndPrintDoc(`自駕Uber免責簽到表_${scheduleDate}`, html, 'portrait');
 }catch(err){
  console.error('printUberWaiver failed', err);
  showToast('產生免責簽到表時發生錯誤：'+(err && err.message ? err.message : err));
 }
}

  const sectionStyle = 'font-weight:700; font-size:14px; margin:14px 0 6px; color:#000;';
  const row = (label, value, opts) => {
    opts = opts || {};
    const filled = value ? escapeHtml(value) : blank(opts.blankLen);
    return `<tr><th style="${thStyle}">${label}</th><td style="${tdStyle} height:${opts.tall?'42px':'28px'};">${filled}</td></tr>`;

    ? `<div style="border:1px solid #000; padding:8px 10px; min-height:28px; line-height:1.7;">${visitDates.map(escapeHtml).join('　／　')}</div>`

      ${row('訪客編號　ID', c.id)}

      ${row('英文姓名　English Name', c.enName)}

/* =========================================================
   Driver Routes
   ========================================================= */
let driverDate = nextBusinessDay(todayStr());
let driverFilter = 'all';

/* ---------- driver route ordering / Google Maps hand-off ----------
   This page has no live map or traffic data, and the published Artifact's
   security sandbox blocks calling any mapping/geocoding API from inside
   it — so real turn-by-turn route optimization can't run in here. What we
   CAN reliably do: (1) keep every stop at the exact same address grouped
   together in the list, and (2) build a one-click Google Maps link,
   starting from the center, through that driver's stops — Google Maps
   itself then has the live traffic data and an "optimize order" option
   to actually sequence the trip efficiently. */
const CENTER_DEPOT_ADDRESS = '1275 E Holt Ave, Pomona, CA 91767';
function normalizeAddressForSort(addr){
  return (addr||'').replace(/\s+/g,' ').trim().toLowerCase();
}
// 這個地址（中心後門那棟）在司機路線排序時要固定排在最下面（最後一站）
const ROUTE_SORT_LAST_PREFIX = '755 north palomares street pomona';
function isRouteSortLastAddress(addr){
  return normalizeAddressForSort(addr).indexOf(ROUTE_SORT_LAST_PREFIX) === 0;
}
function compareAddressesForRoute(addrA, addrB){
  const lastA = isRouteSortLastAddress(addrA) ? 1 : 0;
  const lastB = isRouteSortLastAddress(addrB) ? 1 : 0;
  if(lastA !== lastB) return lastA - lastB;
  return normalizeAddressForSort(addrA).localeCompare(normalizeAddressForSort(addrB));
}
// Google 地圖的地址搜尋對中文字很不穩定（常常整個地址都搜不到），
// 所以組路線連結前，先把備註用的中文字、全形/半形括號裡的附註都拿掉，只留英文地址本身。
function sanitizeAddressForMaps(addr){
  let a = (addr||'');
  a = a.replace(/（[^）]*）/g, ' ');   // 全形括號備註，例如（后门A座）（女儿电话：...）
  a = a.replace(/\([^)]*\)/g, ' ');   // 半形括號備註
  a = a.replace(/[一-鿿]/g, ' '); // 殘留的中文字（漢字）
  a = a.replace(/[，、／]/g, ' ');    // 中文標點
  a = a.replace(/\s+/g,' ').replace(/,\s*,/g, ',').replace(/^[,\s]+|[,\s]+$/g, '').trim();
  return a;
}
// encodeURIComponent alone leaves spaces as %20, which some builds of the
// Google Maps app show as raw literal text in the origin/destination boxes
// instead of decoding them into the address — using "+" (the standard
// application/x-www-form-urlencoded style Google's own URL examples use)
// avoids that.
function mapsEncode(str){
  return encodeURIComponent(str).replace(/%20/g, '+');
}
function buildGoogleMapsRouteUrl(stops){
  const clean = (stops||[]).map(a=>sanitizeAddressForMaps(a)).filter(Boolean);
  if(!clean.length) return null;
  const MAX_WAYPOINTS = 23; // Google Maps directions URL practical limit
  const capped = clean.slice(0, MAX_WAYPOINTS);
  // Round trip back to the center, every stop in between is a waypoint —
  // one link covers the whole run, not just the way out.
  //
  // No "origin" param on purpose: per Google's Maps URL docs, dir_action=navigate
  // only auto-launches turn-by-turn navigation when the origin is the device's
  // current location (omitted, or close to it) — a fixed origin address always
  // falls back to a route-preview screen that needs a manual "Start" tap. Since
  // drivers open this from wherever they actually are, leaving origin out is what
  // gets them real one-tap navigation.
  const destination = mapsEncode(CENTER_DEPOT_ADDRESS);
  const waypoints = capped.map(a=>mapsEncode(a)).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=driving&dir_action=navigate`;
  if(waypoints) url += `&waypoints=${waypoints}`;
  return url;
}
function openDriverRouteInMaps(driverName){
  const wd = weekdayKeyOf(driverDate);
  if(!wd){ showToast('週末無排班'); return; }
  const sched = getDriverScheduledForDate(driverDate).filter(x=>x.client.transportMode==='company' && (x.client.driver||'未指派司機')===driverName);
  const stops = sched
    .slice()
    .sort((a,b)=> compareAddressesForRoute(a.client.address, b.client.address))
    .map(x=>x.client.address)
    .filter(Boolean);
  const url = buildGoogleMapsRouteUrl(stops);
  if(!url){ showToast('這位司機今天沒有地址可以規劃路線'); return; }
  // 注意：這個頁面是在受限的沙盒 iframe 裡執行，window.open() 常常會被瀏覽器悄悄擋掉、
  // 完全沒有反應（跟之前 window.print()/window.prompt() 被擋是同一類問題）。
  // 所以改成彈出一個小視窗，裡面放一個「真的連結」讓使用者自己點（比較容易成功開新分頁），
  // 同時附上「複製連結」按鈕，萬一點了還是沒反應，可以把連結複製貼到瀏覽器或手機地圖 App 開啟。
  showDriverRouteModal(driverName, url, stops.length);
}
function showDriverRouteModal(driverName, url, stopCount){
  const existing = document.getElementById('routeUrlOverlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'routeUrlOverlay';
  overlay.innerHTML = `
    <div class="modal" style="width:520px;">
      <div class="modal-head">
        <h3>${escapeHtml(driverName)} 的路線（共 ${stopCount} 站）</h3>
        <button class="x-close" onclick="document.getElementById('routeUrlOverlay').remove()">✕</button>
      </div>
      <div class="modal-body">
        <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;">
          司機手機要開定位，點開後 Google 地圖通常會直接開始導航；如果只看到路線總覽沒有自動開始，在地圖 App 裡按一下「開始／Start」就可以了。<br>
          如果按鈕沒反應（有些瀏覽器會擋自動開新視窗），可以直接點下面的連結，或用「複製連結」貼到瀏覽器/手機地圖 App 開啟。
        </div>
        <div style="margin-bottom:10px;">
          <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="btn" style="text-decoration:none; display:inline-block;">🗺 點我在 Google 地圖開啟路線</a>
        </div>
        <textarea id="routeUrlText" readonly style="width:100%; height:80px; font-family:monospace; font-size:11px;">${escapeHtml(url)}</textarea>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="document.getElementById('routeUrlOverlay').remove()">關閉</button>
        <button class="btn" onclick="copyRouteUrlToClipboard()">📋 複製連結</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}
async function copyRouteUrlToClipboard(){
  const ta = document.getElementById('routeUrlText');
  const text = ta ? ta.value : '';
  if(!text) return;
  try{
    if(!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('no clipboard api');
    await navigator.clipboard.writeText(text);
    showToast('已複製連結');
  }catch(e){
    ta.focus();
    ta.select();
    showToast('請按 Ctrl+C（Mac：Cmd+C）手動複製');
  }
}
function allDriverNames(){
  const set = new Set();
  CLIENTS.forEach(c=>{ if(c.transportMode==='company' && c.driver) set.add(c.driver); });
  return Array.from(set).sort();
}

const DRIVER_LOAD_WARN_THRESHOLD = 6; // 沒有個別設定車輛座位/趟數時的預設座位數
// DRIVER_CAPACITIES[d] = { seats, trips } —— 該司機車輛座位數 × 當天可接送趟數，
// 相乘即為當天實際可載總人數上限。舊資料若是單一數字，視為「座位數，跑 1 趟」。
function getDriverCapacityInfo(d){
  const v = DRIVER_CAPACITIES[d];
  if(v && typeof v === 'object'){
    const seats = (typeof v.seats === 'number' && v.seats > 0) ? v.seats : DRIVER_LOAD_WARN_THRESHOLD;
    const trips = (typeof v.trips === 'number' && v.trips > 0) ? v.trips : 1;
    return {seats, trips};
  }
  if(typeof v === 'number' && v > 0) return {seats: v, trips: 1};
  return {seats: DRIVER_LOAD_WARN_THRESHOLD, trips: 1};
}
function getDriverCapacity(d){
  const {seats, trips} = getDriverCapacityInfo(d);
  return seats * trips;
}
function promptSetDriverCapacity(d){
  const cur = getDriverCapacityInfo(d);
  const existing = document.getElementById('capacityOverlay');
  if(existing) existing.remove();

  overlay.innerHTML = `

async function saveDriverCapacityFromModal(d){
  const seatsEl = document.getElementById('capSeatsInput');
  const tripsEl = document.getElementById('capTripsInput');
  const seats = parseInt(seatsEl && seatsEl.value, 10);
  const trips = parseInt(tripsEl && tripsEl.value, 10);
  if(!Number.isInteger(seats) || seats <= 0){ showToast('座位數請輸入大於 0 的整數'); return; }
  if(!Number.isInteger(trips) || trips <= 0){ showToast('趟數請輸入大於 0 的整數'); return; }
  DRIVER_CAPACITIES[d] = {seats, trips};
  const overlay = document.getElementById('capacityOverlay');
  if(overlay) overlay.remove();
  await saveDriverCapacities();
  showToast(`已設定「${d}」：${seats} 座 × ${trips} 趟 ＝ 上限 ${seats*trips} 位`);
  render();
}
async function saveDriverCapacities(){ return persistState(); }

// Groups today's company-pickup clients by driver. Normally one entry per
// client under their assigned driver — but a client can carry a
// fridayReturnDriver (e.g. #1/#2: 夏師傅 does the morning pickup every day,
// but every Friday it's Summer who drives them home) which, on a Friday,
// adds a second return-only entry under that other driver so both drivers

function getDriverGroupedForDate(dateStr){
  const sched = getDriverScheduledForDate(dateStr).filter(x=>x.client.transportMode==='company');
  const wd = weekdayKeyOf(dateStr);
  const grouped = {};
  sched.forEach(x=>{
    const key = x.client.driver || '未指派司機';
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(x);
    if(wd==='Fri' && x.client.fridayReturnDriver && x.client.fridayReturnDriver!==key){
      const retKey = x.client.fridayReturnDriver;
      if(!grouped[retKey]) grouped[retKey]=[];
      grouped[retKey].push(Object.assign({}, x, {returnOnly:true}));
    }
  });
  Object.keys(grouped).forEach(k=> grouped[k].sort((a,b)=> compareAddressesForRoute(a.client.address, b.client.address)));
  return grouped;
}

async function addToDriverRouteById(){
  const input = document.getElementById('routeAddIdInput');
  const id = input.value.trim();
  if(!id){ showToast('請輸入編號'); return; }
  const c = getClient(id);
  if(!c){ showToast(`找不到編號 ${id} 的會員`); return; }

  const driverSelect = document.getElementById('routeAddDriverSelect');
  const chosenDriver = driverSelect ? driverSelect.value : '';

  const wd = weekdayKeyOf(driverDate);
  const alreadyBaseline = wd && c.baselineDays.includes(wd) && c.status==='active';
  const dayExc = EXCEPTIONS[driverDate]||[];
  const hasLeave = dayExc.some(e=>e.type==='leave' && e.clientId===id);
  const hasExtra = dayExc.some(e=>e.type==='extra' && e.clientId===id);

  if((alreadyBaseline && !hasLeave) || hasExtra){
    // already scheduled today — just apply/replace driver override if a specific driver was chosen
    if(chosenDriver){
      if(EXCEPTIONS[driverDate]){
        EXCEPTIONS[driverDate] = EXCEPTIONS[driverDate].filter(e=>!(e.type==='adjust' && e.clientId===id));
      }
      const adjEntry = {clientId:id, type:'adjust', driverOverride:chosenDriver, note:'手動指定今日司機'};
      if(c.transportMode !== 'company') adjEntry.transportOverride = 'company';
      addException(driverDate, adjEntry);
      await saveExceptions();
      showToast(`已將 ${clientLabel(c)} 的今日司機改為 ${chosenDriver}`);
    } else {
      showToast(`${clientLabel(c)} 今天已經在路線名單裡了`);
    }
    input.value = '';
    render();
    return;
  }

  // not currently scheduled today -> add as extra, with optional driver override
  if(hasLeave){
    EXCEPTIONS[driverDate] = EXCEPTIONS[driverDate].filter(e=>!(e.type==='leave' && e.clientId===id));
  }
  const entry = {clientId:id, type:'extra', note:'依編號手動加入路線'};
  addException(driverDate, entry);
  if(chosenDriver){
    const adjEntry = {clientId:id, type:'adjust', driverOverride:chosenDriver, note:'手動指定今日司機'};
    if(c.transportMode !== 'company') adjEntry.transportOverride = 'company';
    addException(driverDate, adjEntry);
  }
  await saveExceptions();
  input.value = '';
  showToast(`已將 ${clientLabel(c)} 加入今日路線`);
  render();
}

function removeFromDriverRoute(clientId){
  const c = getClient(clientId);
  if(!c){ showToast('找不到此會員'); return; }
  const dayExc = EXCEPTIONS[driverDate]||[];
  const extraEntry = dayExc.find(e=>e.type==='extra' && e.clientId===clientId);
  if(extraEntry){
    // this person was only on today's route via a manual add/exception — just remove that entry
    removeException(driverDate, extraEntry.id);
    saveExceptions().then(()=>{ showToast(`已從今日路線移除 ${clientLabel(c)}`); render(); });
    return;
  }
  // otherwise they are on their normal baseline schedule — removing means marking leave for the day
  openLeaveModal(clientId, driverDate);
}

// When a driver's day list is over their per-trip seat count but still
// within seats×trips, split it into labeled trips instead of one overloaded
// list. Anyone whose note contains "候補" (standby) is treated as lowest
// priority — they only ride an earlier trip if there's room left over
// after everyone else, otherwise they're pushed to a later trip.
function splitIntoTrips(entries, seats, trips){
  if(trips<=1 || entries.length<=seats) return [entries];
  const isStandby = x => /候補/.test(x.client.note||'');
  const ordered = [...entries.filter(x=>!isStandby(x)), ...entries.filter(isStandby)];
  const result = [];
  for(let i=0;i<trips;i++){
    const chunk = ordered.slice(i*seats, (i+1)*seats);
    if(chunk.length) result.push(chunk);
  }
  // Still more people than seats×trips can hold — append the remainder to
  // the last trip so nobody silently disappears from the printed sheet;
  // the existing overload warning (⚠ 載量偏高) is what flags this to staff.
  const leftover = ordered.slice(trips*seats);
  if(leftover.length && result.length) result[result.length-1].push(...leftover);
  return result;
}

const ROUTE_PAGE_STYLE = `

  /* The 5 office-tracking header columns are narrow enough that
     word-wrap:break-word (needed above for the Address column) was
     breaking mid-word ("Driver" -> "Drive"/"r") — give them their own
     smaller, non-breaking treatment so each word stays whole. */

  table.route-table thead{display:table-header-group;}
  table.route-table tr{page-break-inside:avoid;}
  col.col-mrid{width:5%;}
  col.col-name{width:13%;}
  col.col-cnname{width:10%;}
  col.col-address{width:28%;}
  col.col-phone{width:11%;}
  col.col-fill{width:6.6%;}
  .route-title{text-align:center; font-family:'Noto Serif TC',serif; font-size:22px; font-weight:700; margin:0 0 10px; color:#000;}
  .route-date-row{display:flex; justify-content:flex-start; align-items:baseline; gap:14px; font-size:16px; font-weight:700; border-bottom:2px solid #000; padding-bottom:6px; margin-bottom:2px; color:#000;}
  .spare-row td{color:#fff;}
`;
const DRIVER_ROUTE_TRIP_LABELS = ['第一趟','第二趟','第三趟','第四趟','第五趟'];

// Unlike the fixed-field sign-in sheets elsewhere in this file, a route
// sheet's rows carry free-text addresses of very different lengths, so
// there's no single "rows per page" constant to measure and hardcode —
// and a CSS-only approach (letting the table stretch spare rows to fill
// whatever space real rows didn't use) was tried and measured perfectly
// on screen, but broke under Chromium's print/PDF pagination specifically:
// it silently pushed a near-empty extra page after the real content, even
// with a generous safety buffer, because flex+table fragmentation during
// printing doesn't reflect the same layout getBoundingClientRect reports
// on screen. So instead this measures the real overhead/row heights live
// (same approach as computeRowsPerPage above) and estimates each row's
// height from a coarse, deliberately-conservative content-length check
// (long address or combined name text bumps a row to the taller two-line
// estimate, scaled off the live-measured baseline) — a small unfilled gap
// at the very bottom is an acceptable outcome; spare rows overflowing
// onto a wasted extra page is not.
const A4_LANDSCAPE_USABLE_WIDTH_PX = (297-20)*96/25.4 - PRINT_SAFE_INSET_PX*2;
const A4_LANDSCAPE_USABLE_HEIGHT_PX = (210-20)*96/25.4 - PRINT_SAFE_INSET_PX*2;
function measureRouteMetrics(){
  const container = document.createElement('div');
  container.style.cssText = `position:fixed; left:-9999px; top:0; width:${A4_LANDSCAPE_USABLE_WIDTH_PX}px; visibility:hidden;`;
  container.innerHTML = `<style>${ROUTE_PAGE_STYLE}</style>` + buildDriverPageHtml('Sample Driver', [
    {client:{id:'000', enName:'Sample Name', cnName:'測試姓名', address:'123 Test Street Somewhere, City, CA 90000', phone:'000-000-0000'}},
  ], 0, 1, {spareRows:2, includeTracking:true});
  document.body.appendChild(container);
  let overhead, rowHeight, blankRowHeight;
  try{
    const containerTop = container.getBoundingClientRect().top;
    const rows = container.querySelectorAll('tbody tr');
    if(rows.length >= 3){
      const r0 = rows[0].getBoundingClientRect().top;
      const r1 = rows[1].getBoundingClientRect().top;
      const r2 = rows[2].getBoundingClientRect().top;
      overhead = r0 - containerTop;
      rowHeight = r1 - r0;
      blankRowHeight = r2 - r1;
    }
  }catch(e){ /* fall through to defaults below */ }
  document.body.removeChild(container);
  if(!(overhead > 0)) overhead = 130;
  if(!(rowHeight > 0)) rowHeight = 61;
  if(!(blankRowHeight > 0)) blankRowHeight = 41;
  return {overhead, rowHeight, blankRowHeight};
}
function estimateRouteRowHeight(x, baseRowHeight){
  const cnText = x.client.cnName + (x.returnOnly ? ' (回程)' : '');
  const isTall = (x.client.address||'').length > 25 || (x.client.enName||'').length > 16 || cnText.length > 6;
  return isTall ? Math.round(baseRowHeight * 1.33) : baseRowHeight;
}
function estimateRouteSpareRows(chunk){
  const {overhead, rowHeight, blankRowHeight} = measureRouteMetrics();
  // Real addresses vary in length far more than the length-based "is this
  // row tall" heuristic above can perfectly predict, so this carries a much
  // larger safety margin than the fixed-field sign-in sheets — a modest
  // unfilled gap at the bottom is a fine outcome; spare rows tipping a
  // driver's page onto a wasted extra page is not.
  const usableHeight = A4_LANDSCAPE_USABLE_HEIGHT_PX - 150;
  const usedHeight = chunk.reduce((sum,x)=>sum+estimateRouteRowHeight(x, rowHeight), 0);
  const remaining = usableHeight - overhead - usedHeight;
  return remaining>0 ? Math.floor(remaining/blankRowHeight) : 0;
}

function buildDriverPageHtml(driverName, chunk, tripIndex, tripCount, opts){
  opts = opts || {};
  const spareRows = opts.spareRows || 0;
  const includeTracking = opts.includeTracking !== false;
  const colCount = includeTracking ? 10 : 5;
  return `
    <div class="route-page">
      <div class="route-title">Gentle Heart Daycare Center</div>
      <div class="route-date-row">
        <span>Date: ${fmtDateMDY(driverDate)}</span>
        <span>${escapeHtml(driverName)}${tripCount>1?` · ${DRIVER_ROUTE_TRIP_LABELS[tripIndex]||('第'+(tripIndex+1)+'趟')}`:''}</span>
      </div>
      <table class="route-table">
        <colgroup>
          ${includeTracking
            ? '<col class="col-mrid"><col class="col-name"><col class="col-cnname"><col class="col-address"><col class="col-phone"><col class="col-fill"><col class="col-fill"><col class="col-fill"><col class="col-fill"><col class="col-fill">'
            : '<col style="width:8%;"><col style="width:15%;"><col style="width:13%;"><col style="width:44%;"><col style="width:20%;">'}
        </colgroup>
        <thead><tr>
          <th>MRID</th><th>Name</th><th>Chinese Name</th><th>Address</th><th>Phone</th>
          ${includeTracking? '<th>Driver<br>pick up</th><th>Center<br>Arrival</th><th>Time<br>Out</th><th>Home<br>Arrival</th><th>Driver<br>Initial</th>':''}
        </tr></thead>
        <tbody>
          ${chunk.map(x=>`<tr>
            <td>${escapeHtml(x.client.id)}</td>
            <td>${escapeHtml(x.client.enName)}</td>
            <td>${escapeHtml(x.client.cnName)}${x.returnOnly?' (回程)':''}</td>
            <td>${escapeHtml(x.client.address)}</td>
            <td>${escapeHtml(x.client.phone)}</td>
            ${includeTracking? '<td></td><td></td><td></td><td></td><td></td>':''}
          </tr>`).join('')}
          ${spareRows>0? Array.from({length:spareRows}).map(()=>`<tr class="spare-row">${Array.from({length:colCount}).map(()=>'<td>&nbsp;</td>').join('')}</tr>`).join(''):''}
        </tbody>
      </table>
    </div>
  `;
}

function buildAndOpenDriverRoutes(driversOverride){
 try{
  const grouped = getDriverGroupedForDate(driverDate);
  const drivers = driversOverride || Object.keys(grouped).sort();

  if(!drivers.length){
    openPrintableDoc(`司機接送路線表_${driverDate}`, `<div class="empty-state"><div class="big">🚐</div>${fmtDateHuman(driverDate)} 沒有符合條件的公司接送資料可以列印。</div>`);
    return;
  }

  // spareRows just needs to be "enough rows to divide up the leftover
  // space" — .fill-page's CSS (see ROUTE_PAGE_STYLE) does the actual exact
  // fill by stretching however many unset-height rows exist to consume
  // whatever room the real rows didn't use, so the exact count here isn't
  // load-bearing the way it is for the other print sheets' hardcoded
  // rows-per-page constants.
  const html = `
    <style>${ROUTE_PAGE_STYLE}</style>
    ${drivers.map(d=>{
      const chunk = grouped[d]||[];
      return buildDriverPageHtml(d, chunk, 0, 1, {spareRows:estimateRouteSpareRows(chunk), includeTracking:true});
    }).join('')}`;
  openAndPrintDoc(`司機接送路線表_${driverDate}`, html, 'landscape');
 }catch(err){
    console.error('buildAndOpenDriverRoutes failed', err);
    showToast('產生路線表時發生錯誤：'+(err && err.message ? err.message : err));
 }
}

  });

  const ersClients = sched.filter(x=>isErsDeliveryOnlyToday(x.client, kitchenDate)).map(x=>x.client).sort((a,b)=>idCompare(a.id,b.id));
  const latestEditIso = getLatestScheduleEditTime(kitchenDate);

  root.innerHTML = `

    ${latestEditIso ? `<div class="card card-pad" style="background:var(--amber-soft); border-color:var(--amber); margin-bottom:16px;">
      ⚠️ 這天最近一筆請假／臨時加開異動時間：<b>${fmtEditTime(latestEditIso)}</b>　— 人數是抓剛好的，列印前請確認是這次異動之後印的，不然人數會對不上。
    </div>` : ''}

    ${!wd ? `<div class="card card-pad"><div class="empty-state"><div class="big">🍽️</div>週末無用餐排班。</div></div>` : `
    <div class="grid grid-4" style="margin-bottom:16px;">
      <div class="stat"><div class="num">${sched.length}</div><div class="label">今日總用餐人數</div></div>
      <div class="stat warn"><div class="num">${withDiet.length}</div><div class="label">需特殊飲食人數</div></div>
      <div class="stat"><div class="num">${sched.length-withDiet.length}</div><div class="label">一般餐點人數</div></div>
      <div class="stat"><div class="num">${groupKeys.length}</div><div class="label">飲食類別數</div></div>
    </div>

    <div class="card card-pad" style="margin-bottom:16px;">
      <div class="section-label">今日ERS名單（僅送餐，不到中心） — 共 ${ersClients.length} 位</div>
      ${ersClients.length? `<div class="tag-row">
        ${ersClients.map(c=>`<span class="badge amber">${escapeHtml(c.id)}　${escapeHtml(c.enName)} ${escapeHtml(c.cnName)}</span>`).join('')}
      </div>` : '<div style="color:var(--ink-soft);">今日無ERS會員。</div>'}
    </div>

    <div class="card card-pad">
      <div class="section-label">依飲食需求分類</div>
      ${groupKeys.length? groupKeys.map(k=>`
        <div style="margin-bottom:14px;">
          <div style="font-weight:700; color:var(--clay); margin-bottom:6px;">${escapeHtml(k)} — 共 ${groups[k].length} 位</div>
          <div class="tag-row">
            ${groups[k].map(c=>`<span class="badge clay">${escapeHtml(c.enName)} ${escapeHtml(c.cnName)}</span>`).join('')}
          </div>
        </div>
      `).join(''): '<div style="color:var(--ink-soft);">今日無特殊飲食需求。</div>'}

}

function printKitchen(){
 try{
  const sched = getScheduledForDate(kitchenDate, {includeErs:true});
  const hasDiet = x=>!!dietaryCategory(x.client.dietary);
  const formatDietary = t => (t && t.trim()==='回') ? '回民餐' : t;
  const sorted = sortWithCouplesGrouped(sched);
  const dietCount = sched.filter(hasDiet).length;
  const ersClients = sched.filter(x=>isErsDeliveryOnlyToday(x.client, kitchenDate)).map(x=>x.client).sort((a,b)=>idCompare(a.id,b.id));
  const latestEditIso = getLatestScheduleEditTime(kitchenDate);
  const titleBoxHtml = `
    <style>
      table.kitchen-table{font-size:12px; font-weight:400;}

    ${ersClients.length ? `<div style="background:#F5E8CE; border:1px solid #E3CD9A; border-radius:6px; padding:8px 12px; margin-bottom:12px; font-size:12px; color:#6B4E14;">

  const rowHtml = x => {
      const d = hasDiet(x) ? formatDietary(x.client.dietary) : '';

        ? ' <span style="color:#8C4B32; font-weight:700;">（ERS，不到中心僅送餐）</span>'
        : ' <span style="color:#33565A; font-weight:700;">（ERS，今天特別到中心）</span>') : '';
      const isHalal = /回民餐/.test(d);
      // background set on each <td> (not just the <tr>) since some print
      // engines don't reliably paint a background set only on the row.
      const highlightTd = isHalal ? ' style="background:#FDF098;"' : '';
      return `<tr>
        <td${highlightTd}>${escapeHtml(x.client.id)}</td>
        <td${highlightTd}>${escapeHtml(x.client.enName)} ${escapeHtml(x.client.cnName)}${ersTag}</td>
        <td${highlightTd}>${d? colorizeDietaryText(d) : '—'}</td>
        <td style="text-align:center; font-size:14px; color:#999;${isHalal?'background:#FDF098;':''}">☐</td>
      </tr>`;
  };
  // The ERS banner's length varies day to day, so a couple extra px of
  // safety margin beyond the usual default is added on top of the live
  // measurement rather than trying to be pixel-exact every single day.
  const ROWS_PER_PAGE = computeRowsPerPage({
    titleBoxHtml, theadHtml, tableClass:'sig-table kitchen-table',
    rowHtml: rowHtml(sorted[0] || {client:{id:'000', enName:'Sample Name', cnName:'測試姓名', dietary:'', ers:false}}),
  }, 120);

    titleBoxHtml, theadHtml, colCount:4, rowsPerPage:ROWS_PER_PAGE, extraTableClass:'kitchen-table', blankRowHeight:24,

 }catch(err){

 }

// Categories parsed out of the freeform dietary field, for a
// scoped to whichever day the kitchen tab is currently showing, same as printKitchen.
// color/highlight also drive colorizeDietaryText() below — 回民餐 gets a
// bordered highlight box instead of just colored text since a Halal meal
// mix-up matters more than the other notes.
const SPECIAL_DIET_CATEGORIES = [
  {label:'饅頭', re:/饅頭|馒头/, color:'#B8822E'},
  {label:'糙米', re:/糙米/, color:'#2E5C8A'},
  {label:'不吃蝦', re:/不吃蝦|不吃虾|蝦過敏|虾过敏/, color:'#BD6B4C'},
  {label:'回民餐', re:/回民餐/, color:'#A1443A', highlight:true},
  {label:'不吃雞', re:/不吃雞|不吃鸡/, color:'#4C7A52'},
  {label:'不吃豬肉', re:/不吃豬肉|不吃猪肉|豬肉不吃|猪肉不吃/, color:'#7B5EA7'},
  {label:'不吃豆類', re:/不吃豆|豆類不吃|豆类不吃/, color:'#33565A'},
  {label:'不吃咖喱', re:/不吃咖喱|咖喱不吃/, color:'#8C6318'},
];
// Wraps each matched category substring in the freeform dietary text with
// its own color (回民餐 gets a bordered highlight box instead of just
// colored text, since it's the one that matters most not to mix up).
// Any leftover text that doesn't match a known category stays plain.
function colorizeDietaryText(text){
  let html = escapeHtml(text);
  SPECIAL_DIET_CATEGORIES.forEach(cat=>{
    const re = new RegExp(cat.re.source, cat.re.flags.includes('g') ? cat.re.flags : cat.re.flags+'g');
    html = html.replace(re, m => cat.highlight
      ? `<span style="color:${cat.color}; font-weight:800; background:#FBE4DE; padding:1px 6px; border-radius:4px; border:1px solid ${cat.color};">⚠ ${m}</span>`
      : `<span style="color:${cat.color}; font-weight:700;">${m}</span>`);
  });
  return html;
}

/* =========================================================
   Seating chart — fixed 3 rows x 8 tables, 12 seats per table
   (6 facing 6), assignments persisted (not per-day). Drag a
   member chip from the roster onto an empty seat to assign;
   drag an occupied seat onto another empty seat to move; click
   the small ✕ on an occupied seat to unassign.
   ========================================================= */
const SEAT_TABLE_COUNT = 24; // 3 rows x 8 columns (grid positions, before removing the stage)
const SEAT_PER_TABLE = 12;   // 6 facing 6
const SEAT_STAGE_TABLES = new Set([19,20,21,22]); // middle of row 3 is the stage, not tables
// Display order only — table numbers/labels stay attached to their real
// physical table (1-24), this just controls which row renders on top.
// Row 1 (tables 1-8) and row 3 (17-24) are swapped; row 2 (9-16) unmoved.
const SEAT_DISPLAY_ORDER = [
  17,18,19,20,21,22,23,24,
  9,10,11,12,13,14,15,16,
  1,2,3,4,5,6,7,8,
];
let seatingSearch = '';
let seatingDragClientId = null; // set on dragstart, read on drop

function seatIdsForTable(tableNum){
  return Array.from({length:SEAT_PER_TABLE}, (_,i)=>`t${tableNum}-${i+1}`);
}
function findSeatOfClient(clientId){
  return Object.keys(SEATS).find(seatId=>SEATS[seatId]===clientId) || null;
}
function renderSeating(root){
  // Self-heal any leftover assignment to a seat that's since become part of
  // the stage — it would otherwise stay "assigned" (blocking that member
  // from being dragged elsewhere) while having no visible seat at all.
  Object.keys(SEATS).forEach(seatId=>{
    const tableNum = parseInt(seatId.split('-')[0].slice(1), 10);
    if(SEAT_STAGE_TABLES.has(tableNum)) delete SEATS[seatId];
  });
  const assignedIds = new Set(Object.values(SEATS).filter(Boolean));
  const roster = CLIENTS
    .filter(c=>c.status==='active')
    .filter(c=>!seatingSearch || (c.enName+' '+c.cnName+' '+c.id).toLowerCase().includes(seatingSearch.toLowerCase()))
    .sort((a,b)=>{
      const aAssigned = assignedIds.has(a.id), bAssigned = assignedIds.has(b.id);
      if(aAssigned!==bAssigned) return aAssigned? 1 : -1; // unassigned first
      return idCompare(a.id, b.id);
    });

  const tablesHtml = SEAT_DISPLAY_ORDER.map(tableNum=>{
    if(SEAT_STAGE_TABLES.has(tableNum)){
      // Only emit one spanning placeholder for the first table number in the
      // group — CSS grid auto-flow then places the next real table right
      // after it, so skipping the rest of the group leaves no gap.
      if(tableNum !== Math.min(...SEAT_STAGE_TABLES)) return '';
      return `<div class="seat-stage" style="grid-column:span ${SEAT_STAGE_TABLES.size};">舞台</div>`;
    }
    const seatIds = seatIdsForTable(tableNum);
    return `<div class="seat-table">
        <div class="table-label">桌 ${tableNum}</div>
        <div class="seat-row">${seatIds.slice(0,6).map(buildSeatSlotHtml).join('')}</div>
        <div class="seat-row">${seatIds.slice(6,12).map(buildSeatSlotHtml).join('')}</div>
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">座位表</div>
        <div class="page-sub" id="seatingPageSub">${seatingPageSubText()}</div>
      </div>
      <div class="actions" style="display:flex; gap:8px;">
        <button class="btn ghost" onclick="printSeatingChart()">🖨 列印座位表</button>
      </div>
    </div>
    <div class="card card-pad" style="margin-bottom:14px; font-size:12.5px; color:var(--ink-soft);">
      💡 從左邊名單把會員拖到右邊的空位上即可安排座位；已安排的位子可以直接拖到別的空位搬過去；滑鼠移到已安排的位子上，點右上角 ✕ 可以移除。也可以直接點空位輸入編號，按 Enter 確認。座位是固定安排，不會因為換日期而改變。
    </div>
    <div class="seating-layout">
      <div class="card card-pad">
        <div class="section-label" style="margin-bottom:8px;">會員名單（${roster.length}）</div>
        <input type="text" id="seatingSearchInput" placeholder="搜尋姓名或編號…" style="width:100%; margin-bottom:10px;" value="${escapeHtml(seatingSearch)}" oninput="seatingSearch=this.value; renderSeatingRoster();">
        <div class="seat-roster" id="seatingRosterList">${roster.map(c=>seatChipHtml(c, assignedIds)).join('')}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div id="seatingUnassignedBannerWrap">${seatingUnassignedBannerHtml()}</div>
        <div class="seat-grid">${tablesHtml}</div>
      </div>
    </div>
  `;
}
function buildSeatSlotHtml(seatId){
  const clientId = SEATS[seatId];
  const c = clientId ? getClient(clientId) : null;
  if(c){
    return `<div class="seat-slot occupied" id="seat-${seatId}" draggable="true"
        ondragstart="seatingDragClientId='${escapeHtml(c.id)}'; event.dataTransfer.setData('text/plain','${escapeHtml(c.id)}');"
        ondragover="event.preventDefault(); this.classList.add('drag-over');"
        ondragleave="this.classList.remove('drag-over');"
        ondrop="handleSeatDrop(event, '${seatId}')"
        title="${escapeHtml(c.id)} ${escapeHtml(c.enName)} ${escapeHtml(c.cnName)}">
        <span class="seat-remove" onclick="event.stopPropagation(); unassignSeat('${seatId}')">✕</span>
        ${escapeHtml(c.id)}
      </div>`;
  }
  // Empty seat (or one pointing at a client id that no longer exists/isn't
  // active — treat that the same as empty rather than crashing).
  return `<div class="seat-slot" id="seat-${seatId}" ondragover="event.preventDefault(); this.classList.add('drag-over');" ondragleave="this.classList.remove('drag-over');" ondrop="handleSeatDrop(event, '${seatId}')" onclick="startSeatEntry(this, '${seatId}')">空位</div>`;
}
function seatingPageSubText(){
  const assignedCount = Object.values(SEATS).filter(Boolean).length;
  return `共 ${SEAT_TABLE_COUNT - SEAT_STAGE_TABLES.size} 桌 · 每桌 ${SEAT_PER_TABLE} 人（6對6）· 已安排 ${assignedCount} 位`;
}
function seatingUnassignedBannerHtml(){
  const assignedIds = new Set(Object.values(SEATS).filter(Boolean));
  const unassignedActive = CLIENTS
    .filter(c=>c.status==='active' && !assignedIds.has(c.id))
    .sort((a,b)=>idCompare(a.id,b.id));
  return unassignedActive.length
    ? `<div class="card card-pad" style="border-color:var(--amber); background:var(--amber-soft); font-size:12.5px; color:#6B4E14;">⚠ 尚有 ${unassignedActive.length} 位會員未安排座位：${unassignedActive.map(c=>escapeHtml(c.id+' '+(c.cnName||c.enName))).join('、')}</div>`
    : '';
}
// Patches just the seats/roster/summary that changed instead of a full
// renderSeating() — a full re-render rebuilds all 20 tables from scratch,
// which flashes the whole page and loses scroll position, making it hard
// to quickly click through a long list of empty seats one after another.
function patchSeatingUI(seatIds){
  (seatIds||[]).forEach(seatId=>{
    const el = document.getElementById(`seat-${seatId}`);
    if(el) el.outerHTML = buildSeatSlotHtml(seatId);
  });
  renderSeatingRoster();
  const pageSub = document.getElementById('seatingPageSub');
  if(pageSub) pageSub.textContent = seatingPageSubText();
  const bannerWrap = document.getElementById('seatingUnassignedBannerWrap');
  if(bannerWrap) bannerWrap.innerHTML = seatingUnassignedBannerHtml();
}
function seatChipHtml(c, assignedIds){
  const isAssigned = assignedIds.has(c.id);
  const seatId = isAssigned ? findSeatOfClient(c.id) : null;
  return `<div class="seat-chip" draggable="true"
      ondragstart="seatingDragClientId='${escapeHtml(c.id)}'; event.dataTransfer.setData('text/plain','${escapeHtml(c.id)}');"
      style="${isAssigned?'opacity:.55;':''}">
      <span class="mono">${escapeHtml(c.id)}</span>
      <span>${escapeHtml(c.cnName||c.enName)}</span>
      ${isAssigned? `<span class="badge sage" style="margin-left:auto;">桌${escapeHtml((seatId||'').split('-')[0].replace('t',''))}</span>` : ''}
    </div>`;
}
function renderSeatingRoster(){
  // Cheap re-render of just the roster list (so typing in the search box
  // doesn't rebuild the whole 24-table grid on every keystroke).
  const assignedIds = new Set(Object.values(SEATS).filter(Boolean));
  const roster = CLIENTS
    .filter(c=>c.status==='active')
    .filter(c=>!seatingSearch || (c.enName+' '+c.cnName+' '+c.id).toLowerCase().includes(seatingSearch.toLowerCase()))
    .sort((a,b)=>{
      const aAssigned = assignedIds.has(a.id), bAssigned = assignedIds.has(b.id);
      if(aAssigned!==bAssigned) return aAssigned? 1 : -1;
      return idCompare(a.id, b.id);
    });
  const list = document.getElementById('seatingRosterList');
  if(list) list.innerHTML = roster.map(c=>seatChipHtml(c, assignedIds)).join('');
}
let __seatingSaveTimer = null;
let __seatingSaveWaiters = [];
// Batches rapid consecutive seat edits into a single save. persistState()
// re-publishes the whole page, and a successful publish reloads the view —
// fine for one save at a time, but publishing once per seat during a fast
// batch-entry session means a save started before the previous one's
// reload lands can get cut off mid-flight, which surfaces as "儲存失敗"
// even with a perfectly healthy connection and only one person editing.
// Waiting briefly for a pause in typing collapses a whole burst into one
// real save instead of one per keystroke.
function scheduleSeatingSave(){
  return new Promise(resolve=>{
    __seatingSaveWaiters.push(resolve);
    clearTimeout(__seatingSaveTimer);
    __seatingSaveTimer = setTimeout(async ()=>{
      const waiters = __seatingSaveWaiters;
      __seatingSaveWaiters = [];
      await persistState();
      waiters.forEach(r=>r());
    }, 900);
  });
}
async function assignSeat(seatId, clientId){
  if(SEATS[seatId] && SEATS[seatId]!==clientId){
    showToast('這個位子已經有人了，請先把原本的人移開');
    return null;
  }
  // A member can only sit in one seat — clear wherever they were before.
  const oldSeatId = findSeatOfClient(clientId);
  if(oldSeatId) delete SEATS[oldSeatId];
  SEATS[seatId] = clientId;
  await scheduleSeatingSave();
  return oldSeatId ? [oldSeatId, seatId] : [seatId];
}
async function handleSeatDrop(evt, seatId){
  evt.preventDefault();
  evt.currentTarget.classList.remove('drag-over');
  const clientId = seatingDragClientId || evt.dataTransfer.getData('text/plain');
  seatingDragClientId = null;
  if(!clientId) return;
  const changed = await assignSeat(seatId, clientId);
  patchSeatingUI(changed || []);
}
async function unassignSeat(seatId){
  delete SEATS[seatId];
  await scheduleSeatingSave();
  patchSeatingUI([seatId]);
}
// Click-to-type: lets staff assign a seat by typing a member's id directly,
// which is much faster than drag-and-drop when transcribing a big batch of
// seat assignments (e.g. from a handwritten seating sheet).
function startSeatEntry(el, seatId){
  // Reuses the seat-slot's own id ("seat-<seatId>") rather than a separate
  // one, so patchSeatingUI's generic lookup finds this input (instead of
  // the div it temporarily replaces) and swaps it back on confirm/cancel.
  el.outerHTML = `<input type="text" class="seat-slot-input" id="seat-${escapeHtml(seatId)}" placeholder="編號" autocomplete="off"
      onkeydown="if(event.key==='Enter'){ this.blur(); } else if(event.key==='Escape'){ this.dataset.cancel='1'; this.blur(); }"
      onblur="confirmSeatEntry(this, '${seatId}')">`;
  const input = document.getElementById(`seat-${seatId}`);
  if(input) input.focus();
}
async function confirmSeatEntry(inputEl, seatId){
  if(inputEl.dataset.cancel){ patchSeatingUI([seatId]); return; }
  const raw = inputEl.value.trim();
  if(!raw){ patchSeatingUI([seatId]); return; }
  const c = getClient(raw);
  if(!c){ showToast(`找不到編號「${raw}」的會員`); patchSeatingUI([seatId]); return; }
  if(c.status!=='active'){ showToast(`「${c.cnName||c.enName}」不是使用中的會員`); patchSeatingUI([seatId]); return; }
  const changed = await assignSeat(seatId, c.id);
  patchSeatingUI(changed || [seatId]);
}

const SEATING_PRINT_STYLE = `

  .seating-print-grid .seat-table{background:#fff; border:1px solid #999; border-radius:6px; padding:6px; display:flex; flex-direction:column; gap:4px;}
  .seating-print-grid .table-label{text-align:center; font-size:11px; font-weight:700; color:#555;}
  .seating-print-grid .seat-row{display:flex; gap:3px;}
  .seating-print-grid .seat-slot{flex:1; min-width:0; height:32px; border:1px solid #ccc; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:700; overflow:hidden; white-space:nowrap;}
  .seating-print-grid .seat-slot.occupied{border-color:#2E4E33; background:#E4EEE4; color:#2E4E33;}
  .seating-print-grid .seat-stage{background:repeating-linear-gradient(135deg,#ddd,#ddd 6px,transparent 6px,transparent 12px); border:1px dashed #999; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#666; min-height:76px;}
  .seating-print-unassigned{font-size:12.5px; color:#6B4E14; background:#F5E8CE; border:1px solid #E3CD9A; border-radius:8px; padding:10px 14px;}
`;
function buildSeatingPrintHtml(){
  const assignedIds = new Set(Object.values(SEATS).filter(Boolean));
  const tablesHtml = SEAT_DISPLAY_ORDER.map(tableNum=>{
    if(SEAT_STAGE_TABLES.has(tableNum)){
      if(tableNum !== Math.min(...SEAT_STAGE_TABLES)) return '';
      return `<div class="seat-stage" style="grid-column:span ${SEAT_STAGE_TABLES.size};">舞台</div>`;
    }
    const seatIds = seatIdsForTable(tableNum);
    const seatHtml = seatId => {
      const clientId = SEATS[seatId];
      const c = clientId ? getClient(clientId) : null;
      return c ? `<div class="seat-slot occupied">${escapeHtml(c.id)}</div>` : `<div class="seat-slot"></div>`;
    };
    return `<div class="seat-table">
        <div class="table-label">桌 ${tableNum}</div>
        <div class="seat-row">${seatIds.slice(0,6).map(seatHtml).join('')}</div>
        <div class="seat-row">${seatIds.slice(6,12).map(seatHtml).join('')}</div>
      </div>`;
  }).join('');
  const unassigned = CLIENTS
    .filter(c=>c.status==='active' && !assignedIds.has(c.id))
    .sort((a,b)=>idCompare(a.id,b.id));
  return `
    <style>${SEATING_PRINT_STYLE}</style>
    <div class="print-title">座位表</div>
    <div class="print-sub">${fmtDateHuman(todayStr())} · 共 ${SEAT_TABLE_COUNT - SEAT_STAGE_TABLES.size} 桌 · 已安排 ${assignedIds.size} 位</div>
    <div class="seating-print-grid">${tablesHtml}</div>
    ${unassigned.length ? `<div class="seating-print-unassigned">⚠ 尚有 ${unassigned.length} 位會員未安排座位：${unassigned.map(c=>escapeHtml(c.id+' '+(c.cnName||c.enName))).join('、')}</div>` : ''}
  `;
}
function printSeatingChart(){
  openAndPrintDoc(`座位表_${todayStr()}`, buildSeatingPrintHtml(), 'landscape');
}

/* =========================================================
   Insurance day tracking
   ========================================================= */
function monthDates(yearMonthStr){
  // yearMonthStr like "2026-08" -> all weekday (Mon-Fri) date strings in that month
  const [y,m] = yearMonthStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const out = [];
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(weekdayKeyOf(ds)) out.push(ds);
  }
  return out;
}
function monthUsage(clientId, yearMonthStr){
  const dates = monthDates(yearMonthStr);
  let count = 0;
  dates.forEach(d=>{
    if(getScheduledForDate(d).some(x=>x.client.id===clientId)) count++;
  });
  return count;
}
// How many times each weekday (Mon..Fri) actually occurs within a given month —
// used so the monthly quota reflects real calendar weeks (4 vs 5) instead of a flat x4.
function weekdayOccurrencesInMonth(yearMonthStr){
  const dates = monthDates(yearMonthStr);
  const counts = {Mon:0,Tue:0,Wed:0,Thu:0,Fri:0};
  dates.forEach(d=>{ counts[weekdayKeyOf(d)]++; });
  return counts;
}
// Quota for the month = sum of actual occurrences of each weekday the client is
// normally scheduled on. Falls back to weeklyDays * average-weeks if the client's
// baselineDays count doesn't match their approved weekly days (e.g. boss override).
function monthlyQuotaFor(client, yearMonthStr, weeklyDaysOverride){
  const weeklyDays = weeklyDaysOverride!=null ? weeklyDaysOverride : (client.insuranceDaysPerWeek||0);
  const occ = weekdayOccurrencesInMonth(yearMonthStr);
  if(client.baselineDays && client.baselineDays.length === weeklyDays && weeklyDays>0){
    return client.baselineDays.reduce((sum,d)=>sum+(occ[d]||0), 0);
  }
  // fallback: no matching baseline pattern — approximate using average weekday occurrence
  const totalWeekdayDates = monthDates(yearMonthStr).length;
  const avgWeeksInMonth = totalWeekdayDates/5;
  return Math.round(weeklyDays * avgWeeksInMonth);
}

let insuranceMonthAnchor = todayStr().slice(0,7); // "YYYY-MM"

function renderInsurance(root){
  const ym = insuranceMonthAnchor;
  const [y,m] = ym.split('-').map(Number);
  const monthLabel = `${y}年${m}月`;
  const clients = CLIENTS.filter(c=>c.status==='active').sort((a,b)=>a.enName.localeCompare(b.enName));

  const rows = clients.map(c=>{
    const used = monthUsage(c.id, ym);
    const weeklyApproved = c.insuranceDaysPerWeek||0;
    const monthlyQuota = monthlyQuotaFor(c, ym);
    const remaining = monthlyQuota - used;
    const bossWeekly = c.bossApprovedDays||0;
    const bossMonthlyQuota = bossWeekly ? monthlyQuotaFor(c, ym, bossWeekly) : 0;
    return {c, used, weeklyApproved, monthlyQuota, remaining, bossWeekly, bossMonthlyQuota};
  }).filter(r=>r.monthlyQuota>0 || r.used>0);

  rows.sort((a,b)=> a.remaining - b.remaining);

  root.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">保險天數追蹤</div>
        <div class="page-sub">${monthLabel} · 依會員實際排班星期，計算當月真實出現次數作為總天數</div>
      </div>
      <div class="actions" style="display:flex; gap:8px; align-items:center;">
        <button class="btn ghost sm" onclick="shiftInsMonth(-1)">← 上個月</button>
        <input type="month" id="insMonthInput" value="${ym}">
        <button class="btn ghost sm" onclick="shiftInsMonth(1)">下個月 →</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="datatable">
        <thead><tr>
          <th>姓名</th><th>核准天數／週</th><th>保險當月總天數</th><th>老闆特批天數</th>
          <th>本月已到</th><th>剩餘天數（依保險）</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td><b>${escapeHtml(r.c.enName)}</b><br><span style="color:var(--ink-soft);font-size:12px;">${escapeHtml(r.c.cnName)}</span></td>
              <td>${r.weeklyApproved} 天</td>
              <td><b>${r.monthlyQuota}</b> 天</td>
              <td>${r.bossWeekly ? `<span class="badge amber">${r.bossWeekly} 天／週（約 ${r.bossMonthlyQuota} 天／月）</span>` : '—'}</td>
              <td><b>${r.used}</b></td>
              <td><span class="badge ${r.remaining<0?'red':(r.remaining===0?'amber':'')}">${r.remaining}</span></td>
            </tr>
          `).join('') || `<tr><td colspan="6"><div class="empty-state">尚無設定保險天數的會員資料</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('insMonthInput').addEventListener('change', e=>{ insuranceMonthAnchor=e.target.value; render(); });
}
function shiftInsMonth(n){
  const [y,m] = insuranceMonthAnchor.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  insuranceMonthAnchor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}

/* =========================================================
   Backup / Restore (manual sync safety net across devices)
   ========================================================= */
async function exportBackup(){
  const exportedAt = new Date().toISOString();
  const payload = {
    exportedAt,
    clients: CLIENTS,
    exceptions: EXCEPTIONS,
    capacities: DRIVER_CAPACITIES,
    seats: SEATS
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `長者中心資料備份_${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔案');
  // Shared across everyone (not just this browser) so the sidebar
  // indicator reflects the last backup ANY staff member took, not only
  // ones taken from this specific computer.
  LAST_BACKUP_AT = exportedAt;
  updateBackupIndicator();
  await persistState();
}

// Colors the sidebar's "上次備份" line so a stale backup is hard to miss
// without needing a popup every time someone opens the app.
function updateBackupIndicator(){
  const el = document.getElementById('lastBackup');
  if(!el) return;
  if(!LAST_BACKUP_AT){
    el.textContent = '從未備份';
    el.style.color = 'var(--red, #A1443A)';
    return;
  }
  const days = Math.floor((Date.now() - new Date(LAST_BACKUP_AT).getTime()) / 86400000);
  const when = fmtDateHuman ? fmtDateHuman(LAST_BACKUP_AT.slice(0,10)) : LAST_BACKUP_AT.slice(0,10);
  el.textContent = days<=0 ? '今天' : `${when}（${days} 天前）`;
  el.style.color = days > 30 ? 'var(--red, #A1443A)' : days > 14 ? 'var(--amber, #B8822E)' : '#9FB3AE';
}

function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload.clients || !payload.exceptions){ showToast('檔案格式不正確'); evt.target.value=''; return; }
      openConfirmModal(
        `確定要匯入此備份嗎？\n備份時間：${payload.exportedAt}\n會員數：${payload.clients.length}\n\n這會覆蓋目前畫面上的資料並存回共用資料庫。`,
        async ()=>{
          CLIENTS = payload.clients;
          EXCEPTIONS = payload.exceptions;
          DRIVER_CAPACITIES = (payload.capacities && typeof payload.capacities === 'object') ? payload.capacities : {};
          SEATS = (payload.seats && typeof payload.seats === 'object') ? payload.seats : {};
          await saveClients();
          await saveExceptions();
          showToast('匯入完成，資料已更新');
          render();
        },
        '確定匯入'
      );
    }catch(err){
      console.error(err);
      showToast('匯入失敗，檔案可能損毀');
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}
