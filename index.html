<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長者中心客戶管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2EA;
  --panel:#FFFFFF;
  --ink:#2B2620;
  --ink-soft:#6B6357;
  --line:#E4DDCE;
  --teal:#33565A;
  --teal-dark:#22393C;
  --clay:#BD6B4C;
  --clay-soft:#F1DCD1;
  --sage:#7C9A82;
  --sage-soft:#E4EEE4;
  --amber:#B8822E;
  --amber-soft:#F5E8CE;
  --red:#A1443A;
  --red-soft:#F3DEDA;
  --radius:10px;
  --shadow:0 1px 2px rgba(43,38,32,0.06), 0 4px 14px rgba(43,38,32,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans TC','Helvetica Neue',Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.serif{font-family:'Noto Serif TC',serif;}

/* ---- App shell ---- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:212px; flex-shrink:0;
  background:var(--teal-dark);
  color:#EFE7D8;
  display:flex; flex-direction:column;
  padding:22px 14px;
  position:sticky; top:0; height:100vh;
}
.brand{
  font-family:'Noto Serif TC',serif;
  font-weight:700; font-size:18px;
  letter-spacing:.02em;
  color:#F6F2EA;
  margin-bottom:2px;
}
.brand-sub{
  font-size:11px; color:#9FB3AE; margin-bottom:26px; letter-spacing:.04em;
}
.navlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px;}
.navlist button{
  all:unset; cursor:pointer;
  display:flex; align-items:center; gap:9px;
  padding:9px 10px; border-radius:8px;
  font-size:13.5px; color:#D9D1BF;
  transition:background .15s, color .15s;
}
.navlist button:hover{background:rgba(255,255,255,0.06); color:#fff;}
.navlist button.active{background:#F6F2EA; color:var(--teal-dark); font-weight:700;}
.navlist .ico{width:16px; text-align:center; font-size:14px;}
.side-foot{margin-top:auto; font-size:10.5px; color:#78897F; line-height:1.6; padding-top:16px;}

.main{flex:1; min-width:0; padding:26px 34px 60px;}
.topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.page-title{font-family:'Noto Serif TC',serif; font-weight:700; font-size:22px; color:var(--teal-dark);}
.page-sub{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}

/* ---- Cards / panels ---- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-pad{padding:18px 20px;}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

/* ---- Mobile layout ---- */
@media (max-width:760px){
  #app{flex-direction:column;}
  .sidebar{
    position:static; width:100%; height:auto; flex-direction:row; flex-wrap:wrap;
    align-items:center; padding:12px 14px; gap:8px;
  }
  .brand-sub{display:none;}
  .brand{margin-bottom:0; margin-right:auto; font-size:15px;}
  #readOnlyBadge{margin-bottom:0;}
  .navlist{flex-direction:row; flex-wrap:wrap; width:100%; order:3; gap:6px;}
  .navlist button{padding:7px 9px; font-size:12.5px;}
  .side-foot{order:2; width:100%; margin-top:0; padding-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .side-foot br{display:none;}
  .side-foot button{width:auto; flex:1 1 auto; margin-top:0 !important;}
  .main{padding:16px 12px 40px;}
  .topbar{flex-direction:column; align-items:stretch;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .modal{width:100% !important; max-width:100%; border-radius:0; max-height:100vh;}
  .overlay{padding:0;}
  table.datatable{font-size:12px;}
  .search-row input[type=text]{width:100%;}
  .search-row{flex-direction:column; align-items:stretch;}
}

.stat{
  padding:16px 18px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel);
}
.stat .num{font-family:'Noto Serif TC',serif; font-size:30px; font-weight:700; color:var(--teal-dark); line-height:1.1;}
.stat .label{color:var(--ink-soft); font-size:12px; margin-top:4px;}
.stat.warn{background:var(--amber-soft); border-color:#E3CD9A;}
.stat.warn .num{color:var(--amber);}
.stat.danger{background:var(--red-soft); border-color:#E3B9B2;}
.stat.danger .num{color:var(--red);}

/* ---- Buttons/inputs ---- */
button.btn{
  all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:8px; font-size:13px; font-weight:500;
  background:var(--teal); color:#fff; transition:background .15s;
}
button.btn:hover{background:var(--teal-dark);}
button.btn.ghost{background:transparent; color:var(--teal); border:1px solid var(--teal);}
button.btn.ghost:hover{background:var(--sage-soft);}
button.btn.warn{background:var(--clay); color:#fff;}
button.btn.warn:hover{background:#a15236;}
button.btn.sm{padding:5px 10px; font-size:12px;}
button.btn.tiny{padding:3px 8px; font-size:11.5px; border-radius:6px;}
button.btn:disabled{opacity:.4; cursor:not-allowed;}

input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{
  font-family:inherit; font-size:13px; padding:7px 10px; border-radius:7px;
  border:1px solid var(--line); background:#fff; color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage); outline-offset:1px;}
label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft);}
label.field input,label.field select,label.field textarea{color:var(--ink); font-size:13.5px;}

/* ---- Table ---- */
table.datatable{width:100%; border-collapse:collapse; font-size:13px;}
table.datatable th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--ink-soft); padding:9px 10px; border-bottom:2px solid var(--line);
  background:#FBF8F2; position:sticky; top:0;
}
table.datatable td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.datatable tr:hover td{background:#FAF6EE;}
.table-wrap{max-height:70vh; overflow:auto; border-radius:var(--radius); border:1px solid var(--line);}

.badge{
  display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
  background:var(--sage-soft); color:#3E6448; margin-right:3px;
}
.badge.gray{background:#EEE9DD; color:var(--ink-soft);}
.badge.clay{background:var(--clay-soft); color:#8C4B32;}
.badge.amber{background:var(--amber-soft); color:#8C6318;}
.badge.red{background:var(--red-soft); color:var(--red);}
.badge.teal{background:#DCEAE8; color:var(--teal-dark);}
.badge.sage{background:var(--sage-soft); color:#3E6448;}

.pill-days{display:flex; gap:3px;}
.pill-days span{
  width:20px; height:20px; border-radius:5px; font-size:10px; font-weight:700;
  display:flex; align-items:center; justify-content:center; background:#EEE9DD; color:#B8AF9B;
}
.pill-days span.on{background:var(--sage); color:#fff;}

.search-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-row input[type=text]{width:220px;}

/* ---- Modal ---- */
.overlay{
  position:fixed; inset:0; background:rgba(34,29,22,0.45); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  background:#fff; border-radius:14px; width:640px; max-width:100%; max-height:88vh; overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
.modal-head{
  padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
  position:sticky; top:0; background:#fff; z-index:2;
}
.modal-head h3{margin:0; font-family:'Noto Serif TC',serif; font-size:18px; color:var(--teal-dark);}
.modal-body{padding:20px 22px;}
.modal-foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.x-close{all:unset; cursor:pointer; font-size:18px; color:var(--ink-soft); padding:4px 8px; border-radius:6px;}
.x-close:hover{background:#EEE9DD;}

.section-label{font-size:12px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.05em; margin:18px 0 8px;}
.section-label:first-child{margin-top:0;}

.hist-item{padding:8px 10px; border-radius:7px; background:#FBF8F2; border:1px solid var(--line); font-size:12.5px; margin-bottom:6px; display:flex; justify-content:space-between; gap:8px;}
.hist-item .meta{color:var(--ink-soft);}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty-state .big{font-size:34px; margin-bottom:8px;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--teal-dark); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
  box-shadow:var(--shadow); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.tag-row{display:flex; gap:6px; flex-wrap:wrap;}
.driver-chip{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px;
  background:var(--panel); border:1px solid var(--line); font-size:12px; cursor:pointer;
}
.driver-chip.active{background:var(--teal); color:#fff; border-color:var(--teal);}

.kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px;}
.kv .k{color:var(--ink-soft);}

.note-flag{color:var(--clay); font-weight:600;}

/* Print styles */
@media print{
  .sidebar,.topbar .actions,.no-print,.search-row,.overlay{display:none !important;}
  .main{padding:0; margin:0;}
  body{background:#fff;}
  .card{box-shadow:none; border:none;}
  .table-wrap{max-height:none; overflow:visible; border:none;}
  table.datatable th{position:static; background:#fff;}
}
.print-title{font-family:'Noto Serif TC',serif; font-size:20px; font-weight:700; margin-bottom:2px;}
.print-sub{color:#555; font-size:12px; margin-bottom:14px;}
.sig-table td, .sig-table th{border:1px solid #999; padding:8px 10px;}
.sig-table{width:100%; border-collapse:collapse; font-size:13px;}
.sig-table th{background:#F0EBDD;}

.scroll-x{overflow-x:auto;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#D8CFBC; border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

/* Print preview pane (avoids blocked window.print()/window.open() inside sandboxed iframe) */
.print-preview-pane{
  position:fixed; inset:0; background:#fff; z-index:200; overflow:auto;
  padding:34px 40px; display:none;
}
.print-preview-bar{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--amber-soft); border:1px solid #E3CD9A; border-radius:10px;
  padding:12px 16px; margin-bottom:22px; font-size:13.5px; color:#6B4E14;
}
.print-preview-bar b{font-size:14px;}
body.print-mode-active .sidebar,
body.print-mode-active .main{display:none !important;}
body.print-mode-active .print-preview-pane{display:block;}
@media print{
  .print-preview-bar{display:none !important;}
  body:not(.print-mode-active) .print-preview-pane{display:none !important;}
  /* Fixed positioning clips content to one viewport height when printing —
     switch to normal document flow so multi-page content isn't cut off. */
  html, body{height:auto !important; overflow:visible !important;}
  .print-preview-pane{
    position:static !important;
    inset:auto !important;
    height:auto !important;
    max-height:none !important;
    overflow:visible !important;
    padding:0 !important;
  }
}
</style>

function uid(){ return Math.random().toString(36).slice(2,9); }

function todayStr(){
  const d = new Date();
  return ymd(d);
}
function ymd(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function weekdayKeyOf(dateStr){
  const d = parseDate(dateStr);
  const idx = d.getDay(); // 0 Sun ... 6 Sat
  const map = {1:"Mon",2:"Tue",3:"Wed",4:"Thu",5:"Fri"};
  return map[idx] || null;
}
function fmtDateHuman(dateStr){
  const d = parseDate(dateStr);
  const wd = weekdayKeyOf(dateStr);
  const wLabel = wd ? DAY_LABEL_FULL[wd] : "週末";
  return `${dateStr}（${wLabel}）`;
}
const DAY_LABEL_EN = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};
function fmtDateEnglish(dateStr){
  const wd = weekdayKeyOf(dateStr);
  const wLabel = wd ? DAY_LABEL_EN[wd] : "Weekend";
  return `${dateStr} (${wLabel})`;
}
function fmtDateMDY(dateStr){
  const d = parseDate(dateStr);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${d.getFullYear()}`;
}
function mondayOf(dateStr){
  const d = parseDate(dateStr);
  const day = d.getDay(); // 0 Sun
  const diff = (day===0) ? -6 : 1-day;
  const mon = new Date(d); mon.setDate(d.getDate()+diff);
  return ymd(mon);
}
function addDays(dateStr,n){
  const d = parseDate(dateStr); d.setDate(d.getDate()+n); return ymd(d);
}
function weekDates(mondayStr){
  return DAY_KEYS.map((k,i)=>addDays(mondayStr,i));
}

async function loadData(){
  function loadFromSeed(){
    const seedEl = document.getElementById('clients-seed-data');
    CLIENTS = JSON.parse(seedEl.textContent);
    EXCEPTIONS = {};
    DRIVER_CAPACITIES = {};
    // First-ever load (no published state yet): fold the one-time data
    // migrations into the seed once, in memory. Once this state is
    // persisted via persistState(), future loads read #app-state instead
    // and this never runs again.
    applyOneTimePatches();
  }
  try{
    const stateEl = document.getElementById('app-state');
    const stateText = stateEl && stateEl.textContent ? stateEl.textContent.trim() : '';
    if(stateText){
      const state = JSON.parse(stateText);
      CLIENTS = Array.isArray(state.clients) ? state.clients : [];
      EXCEPTIONS = (state.exceptions && typeof state.exceptions === 'object') ? state.exceptions : {};
      DRIVER_CAPACITIES = (state.capacities && typeof state.capacities === 'object') ? state.capacities : {};
    } else {
      loadFromSeed();
    }
  }catch(err){
    console.error('failed to parse saved app state, falling back to seed', err);
    try{ loadFromSeed(); }catch(err2){ console.error('seed load failed too', err2); CLIENTS = []; EXCEPTIONS = {}; DRIVER_CAPACITIES = {}; }
  }
  DATA_READY = true;
  document.getElementById('lastSync').textContent = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
}

/* ---------- Claude Artifact persistence ----------
   Every mutation to CLIENTS/EXCEPTIONS is persisted by publishing a new
   version of this whole page, with the current state re-embedded in the
   #app-state <script> tag. The platform live-reloads every other open
   view to that new version, so all viewers converge on the latest data. */
let READ_ONLY = false;
let __artifactUnavailableWarned = false;

function escapeStateForScriptTag(json){
  return json.replace(/</g, '\\u003c');
}

function buildPublishHTML(){
  const stateJSON = escapeStateForScriptTag(JSON.stringify({clients: CLIENTS, exceptions: EXCEPTIONS, capacities: DRIVER_CAPACITIES}));
  // outerHTML never includes the doctype, so prefix it back on.
  const html = '<!doctype html>\n' + RAW_TEMPLATE;
  return html.replace(
    /<script id="app-state" type="application\/json">[\s\S]*?<\/script>/,
    `<script id="app-state" type="application/json">${stateJSON}<\/script>`
  );
}

function setReadOnlyMode(){
  if(READ_ONLY) return;
  READ_ONLY = true;
  const badge = document.getElementById('readOnlyBadge');
  if(badge) badge.style.display = '';
  showToast('您沒有編輯權限，此為唯讀檢視');
}

// Block write-affordance buttons app-wide once we've learned this view is
// read-only. Registered once; a no-op until READ_ONLY flips true.
document.addEventListener('click', function(e){
  if(!READ_ONLY) return;
  const btn = e.target.closest('button.btn');
  if(btn && !btn.classList.contains('tiny')){
    e.preventDefault();
    e.stopPropagation();
    showToast('唯讀模式，無法編輯');
  }
}, true);

const UI_RESTORE_KEY = 'gh_ui_restore_state';

// Publishing (below) makes the platform reload this same view to the newly
// saved version, which re-runs the whole page from scratch — CURRENT_TAB
// resets to "dashboard" and any open member modal is gone. Stash what was
// on screen right before publishing so the boot sequence can put it back.
function saveUIStateForReload(){
  try{
    const state = { tab: CURRENT_TAB };
    const overlay = document.getElementById('memberOverlay');
    if(overlay){
      const idInput = document.getElementById('f_id_original');
      if(idInput && idInput.value) state.memberModalId = idInput.value;
    }
    sessionStorage.setItem(UI_RESTORE_KEY, JSON.stringify(state));
  }catch(e){}
}

async function persistState(){
  document.getElementById('lastSync').textContent = new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  let artifactNs = null;
  try{
    if(typeof claude !== 'undefined' && claude && claude.use){
      artifactNs = await claude.use('artifact');
    }
  }catch(e){ artifactNs = null; }

  if(!artifactNs){
    if(!__artifactUnavailableWarned){
      __artifactUnavailableWarned = true;
      showToast('此檢視不支援自動儲存');
    }
    return;
  }

  try{
    saveUIStateForReload();
    await artifactNs.publish(buildPublishHTML());
  }catch(err){
    const code = err && err.code;
    if(code === 'conflict'){
      // Someone else published first — the platform is already reloading
      // this view to the winning version. Nothing to do.
      return;
    }
    if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){
      setReadOnlyMode();
      return;
    }
    console.error('persistState failed', err);
    showToast('儲存失敗，請稍後再試');
  }
}

/* ---------- client lookups ---------- */
function getClient(id){ return CLIENTS.find(c=>c.id===id); }
function getSpouseId(client){
  if(!client || !client.relationship) return null;
  const m = client.relationship.match(/^\s*([^\/\s]+)\s*\/\s*([^\/\s]+)\s*夫妻/);
  if(!m) return null;
  const a = m[1], b = m[2];
  if(a === client.id) return b;
  if(b === client.id) return a;
  return null;
}
function clientLabel(c){ return `${c.enName}／${c.cnName || ''}`.replace(/／$/,''); }

/* ---------- schedule engine ---------- */
// returns array of {client, isExtra, note}
function getScheduledForDate(dateStr){
  const wd = weekdayKeyOf(dateStr);
  const dayExceptions = EXCEPTIONS[dateStr] || [];
  const leaveIds = new Set(dayExceptions.filter(e=>e.type==='leave').map(e=>e.clientId));
  const extraEntries = dayExceptions.filter(e=>e.type==='extra');
  const adjustByClient = {};
  dayExceptions.filter(e=>e.type==='adjust').forEach(e=>{ adjustByClient[e.clientId] = e; });

  function applyAdjust(c){
    const adj = adjustByClient[c.id];
    if(!adj) return {client:c, isAdjusted:false, adjustNote:''};
    const effective = Object.assign({}, c);
    if(adj.driverOverride) effective.driver = adj.driverOverride;
    if(adj.transportOverride) effective.transportMode = adj.transportOverride;
    if(adj.subModeOverride) effective.subMode = adj.subModeOverride;
    return {client:effective, isAdjusted:true, adjustNote:adj.note||''};
  }

  let list = [];
  if(wd){
    CLIENTS.forEach(c=>{
      if(c.status!=='active') return;
      if(!c.baselineDays.includes(wd)) return;
      if(leaveIds.has(c.id)) return;
      const {client, isAdjusted, adjustNote} = applyAdjust(c);
      list.push({client, isExtra:false, note:'', isAdjusted, adjustNote});
    });
  }
  extraEntries.forEach(e=>{
    const c = getClient(e.clientId);
    if(c){
      const {client, isAdjusted, adjustNote} = applyAdjust(c);
      list.push({client, isExtra:true, note:e.note||'', isAdjusted, adjustNote});
    }
  });
  // de-dup in case a client is both baseline-present and extra somehow
  const seen = new Set();
  list = list.filter(item=>{
    if(seen.has(item.client.id)) return false;
    seen.add(item.client.id); return true;
  });
  list.sort((a,b)=> (a.client.enName||'').localeCompare(b.client.enName||''));
  return list;
}

function getAdjustEntries(dateStr){
  return (EXCEPTIONS[dateStr]||[]).filter(e=>e.type==='adjust');
}

function getLeaveEntries(dateStr){
  return (EXCEPTIONS[dateStr]||[]).filter(e=>e.type==='leave');
}

function addException(dateStr, entry){
  if(!EXCEPTIONS[dateStr]) EXCEPTIONS[dateStr]=[];
  EXCEPTIONS[dateStr].push(Object.assign({id:uid(), createdAt:new Date().toISOString()}, entry));
}
function removeException(dateStr, excId){
  if(!EXCEPTIONS[dateStr]) return;
  EXCEPTIONS[dateStr] = EXCEPTIONS[dateStr].filter(e=>e.id!==excId);
  if(EXCEPTIONS[dateStr].length===0) delete EXCEPTIONS[dateStr];
}

function getClientHistory(clientId){
  const rows = [];
  Object.keys(EXCEPTIONS).sort().forEach(date=>{
    EXCEPTIONS[date].forEach(e=>{
      if(e.clientId===clientId){
        rows.push(Object.assign({date}, e));
      }
    });
  });
  return rows.reverse();
}

// weekly insurance usage: count of scheduled days (Mon-Fri) for a given client within a week
function weekUsage(clientId, mondayStr){
  const dates = weekDates(mondayStr);
  let count = 0;
  const days = [];
  dates.forEach((d,i)=>{
    const sched = getScheduledForDate(d);
    const present = sched.some(x=>x.client.id===clientId);
    if(present){ count++; days.push(DAY_KEYS[i]); }
  });
  return {count, days};
}

/* =========================================================
   Quick natural-language instruction parser
   e.g. "52明天来128不来" -> [{clientId:'52', date:tomorrow, type:'extra'}, {clientId:'128', date:tomorrow, type:'leave'}]
   ========================================================= */
const CN_WEEKDAY_MAP = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
const KNOWN_DRIVERS = ['夏师傅','霍师傅','尚师傅','杜师傅','Zhu师傅','Jennifer','民师傅','Summer','Boss','小林師傅'];
const OUTSOURCED_DRIVERS = ['尚师傅','霍师傅','Jennifer','Summer'];
function driverTypeLabel(driverName){
  if(!driverName) return '';
  return OUTSOURCED_DRIVERS.includes(driverName) ? '外包' : '中心自有';
}

function nextWeekdayDate(cnChar){
  const target = CN_WEEKDAY_MAP[cnChar];
  if(target===undefined) return null;
  const today = todayStr();
  const dow = parseDate(today).getDay();
  const daysSinceMonday = (dow+6)%7;
  const thisMonday = addDays(today, -daysSinceMonday);
  const nextMonday = addDays(thisMonday, 7);
  const offset = (target===0) ? 6 : target-1;
  return addDays(nextMonday, offset);
}

function parseQuickInstruction(text){
  if(!text || !text.trim()) return [];
  // Support pasting a whole block of messages (e.g. copied from WeChat) —
  // each line is parsed independently so one line's date doesn't leak
  // into the next unrelated line.
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(lines.length > 1){
    let all = [];
    lines.forEach(line=>{ all = all.concat(parseQuickLine(line)); });
    return all;
  }
  return parseQuickLine(text);
}
function parseQuickLine(text){
  if(!text || !text.trim()) return [];
  const dateTokens = [];
  const dateOriginalText = [];
  let masked = text.replace(/下[週周]([一二三四五六日天])|今天|明天|後天|后天|(\d{1,2})[\/月](\d{1,2})[日号]?/g, (m, wd, mo, da)=>{
    let resolved = null;
    if(wd) resolved = nextWeekdayDate(wd);
    else if(m==='今天') resolved = todayStr();
    else if(m==='明天') resolved = addDays(todayStr(),1);
    else if(m==='後天'||m==='后天') resolved = addDays(todayStr(),2);
    else if(mo && da){
      let y = parseDate(todayStr()).getFullYear();
      resolved = `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;
    }
    if(!resolved) return m;
    dateTokens.push(resolved);
    dateOriginalText.push(m);
    return `§D${dateTokens.length-1}§`;
  });

  const idMatches = [];
  const idRe = /\d{1,4}/g;
  let m;
  while((m = idRe.exec(masked))){
    if(getClient(m[0])) idMatches.push({id:m[0], index:m.index, len:m[0].length});
  }
  if(!idMatches.length) return [];

  function cleanText(seg){
    return seg.replace(/§D(\d+)§/g, (_,n)=>dateOriginalText[Number(n)]||'').trim();
  }

  const results = [];
  let lastDate = todayStr();
  for(let i=0;i<idMatches.length;i++){
    const start = idMatches[i].index + idMatches[i].len;
    const end = (i+1<idMatches.length) ? idMatches[i+1].index : masked.length;
    const segment = masked.slice(start, end);
    const clientId = idMatches[i].id;

    const dateMatch = segment.match(/§D(\d+)§/);
    let date = lastDate;
    if(dateMatch){ date = dateTokens[Number(dateMatch[1])]; lastDate = date; }

    const client = getClient(clientId);
    if(!client) continue;
    const readableSegment = cleanText(segment);

    const isLeave = /不來|不来|請假|请假/.test(segment);
    const isCome = !isLeave && /來|来|加開|加开|到訪|到访/.test(segment);
    const driverMatch = segment.match(/[换換][^\d§]{0,6}?(师傅|司机|師傅|司機)/);
    let driverOverride = '';
    if(driverMatch){
      const raw = driverMatch[0].replace(/^[换換]/,'').trim();
      const found = KNOWN_DRIVERS.find(d=>raw.includes(d.replace(/师傅|師傅/,'')) || d===raw);
      driverOverride = found || raw;
    }
    const transportMatch = segment.match(/自駕|自驾|Uber|uber/);
    const selfNoteMatch = segment.match(/自己回去|自己回家|自己來|自己来|自己過來|自己过来/);

    if(isLeave){
      results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'leave', note: readableSegment, rawSegment: readableSegment});
    } else if(isCome){
      const wd = weekdayKeyOf(date);
      const alreadyBaseline = wd && client.baselineDays.includes(wd);
      if(!alreadyBaseline){
        results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'extra', note: readableSegment, rawSegment: readableSegment});
      } else {
        results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'info', note:'原本就排班，不需異動', rawSegment: readableSegment});
      }
    }

    if(driverOverride || transportMatch || selfNoteMatch){
      const entry = {id:uid(), clientId, clientName:clientLabel(client), date, type:'adjust', rawSegment: readableSegment};
      if(driverOverride) entry.driverOverride = driverOverride;
      if(transportMatch){
        entry.transportOverride = 'uber_self';
        entry.subModeOverride = /uber/i.test(transportMatch[0]) ? 'Uber' : '自駕';
      }
      entry.note = readableSegment;
      results.push(entry);
    }

    if(!isLeave && !isCome && !driverOverride && !transportMatch && !selfNoteMatch && segment.trim()){
      results.push({id:uid(), clientId, clientName:clientLabel(client), date, type:'unrecognized', note: readableSegment, rawSegment: readableSegment});
    }
  }
  return results;
}

async function applyQuickResults(results){
  let changed = false;
  for(const r of results){
    if(r.type==='leave'){
      addException(r.date, {clientId:r.clientId, type:'leave', note:'快速輸入：'+r.rawSegment});
      changed = true;
    } else if(r.type==='extra'){
      addException(r.date, {clientId:r.clientId, type:'extra', note:'快速輸入：'+r.rawSegment});
      changed = true;
    } else if(r.type==='adjust'){
      if(EXCEPTIONS[r.date]){
        EXCEPTIONS[r.date] = EXCEPTIONS[r.date].filter(e=>!(e.type==='adjust' && e.clientId===r.clientId));
      }
      const entry = {clientId:r.clientId, type:'adjust', note:'快速輸入：'+r.rawSegment};
      if(r.driverOverride) entry.driverOverride = r.driverOverride;
      if(r.transportOverride) entry.transportOverride = r.transportOverride;
      if(r.subModeOverride) entry.subModeOverride = r.subModeOverride;
      addException(r.date, entry);
      changed = true;
    }
  }
  if(changed) await saveExceptions();
  return changed;
}

/* =========================================================
   Driver recommendation by address (based on existing driver service areas)
   ========================================================= */
let DRIVER_CITY_MAP = null;
function loadDriverCityMap(){
  if(DRIVER_CITY_MAP) return DRIVER_CITY_MAP;
  try{
    const el = document.getElementById('driver-city-map');
    DRIVER_CITY_MAP = el ? JSON.parse(el.textContent) : {cities:[], cityDriverRank:{}};
  }catch(e){ DRIVER_CITY_MAP = {cities:[], cityDriverRank:{}}; }
  return DRIVER_CITY_MAP;
}
function extractStreetKey(address){
  if(!address) return '';
  // Strip leading house number, keep the street name portion, normalize for comparison.
  let s = address.trim().toLowerCase();
  s = s.replace(/^[\d\-]+\s*/, ''); // remove leading house number
  // Drop periods before cutting on punctuation — otherwise an abbreviated
  // direction/street type like "S." or "Ave." truncates the key to almost
  // nothing (e.g. "S. San Antonio Ave" would cut down to just "s").
  s = s.replace(/\./g, '');
  s = s.replace(/[,#].*$/, '');    // cut off at first comma/unit-marker
  s = s.replace(/\b(unit|apt|ste|suite|#)\b.*/,'');
  s = s.replace(/\s+/g,' ').trim();
  return s;
}

function suggestDriversForAddress(address, excludeClientId){
  if(!address || !address.trim()) return {city:null, drivers:[], exactMatches:[]};

  // 1) Strongest signal: someone already on (very close to) the same street already has a driver.
  //    Grouping people on the same street with the same driver keeps routes efficient.
  const streetKey = extractStreetKey(address);
  let exactMatches = [];
  if(streetKey && streetKey.length>=5){
    const seen = new Set();
    CLIENTS.forEach(c=>{
      if(c.id===excludeClientId) return;
      if(c.status!=='active' || c.transportMode!=='company' || !c.driver) return;
      const otherKey = extractStreetKey(c.address);
      if(otherKey && otherKey===streetKey && !seen.has(c.driver)){
        seen.add(c.driver);
        exactMatches.push({driver:c.driver, matchedWith:clientLabel(c)});
      }
    });
  }

  // 2) Fallback / secondary signal: general city-level history.
  const map = loadDriverCityMap();
  const lower = address.toLowerCase();
  const sortedCities = [...map.cities].sort((a,b)=>b.length-a.length);
  const found = sortedCities.find(city=>lower.includes(city.toLowerCase()));
  const cityDrivers = found ? (map.cityDriverRank[found] || []) : [];

  return {city:found, drivers:cityDrivers, exactMatches};
}

// Live driver workload, recalculated from current CLIENTS every time (not baked seed data),
// so it stays accurate as members are added/removed/reassigned.
function getDriverLoad(driverName){
  return CLIENTS.filter(c=>c.status==='active' && c.transportMode==='company' && c.driver===driverName).length;
}
function getAllDriverLoads(){
  const loads = {};
  CLIENTS.forEach(c=>{
    if(c.status==='active' && c.transportMode==='company' && c.driver){
      loads[c.driver] = (loads[c.driver]||0)+1;
    }
  });
  return loads;
}
function overloadThreshold(){
  const loads = getAllDriverLoads();
  const vals = Object.values(loads);
  if(!vals.length) return Infinity;
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  return avg*1.4; // ~40% above the average driver's load counts as "likely full"
}
function updateDriverSuggestion(){
  const addrEl = document.getElementById('f_addr');
  const box = document.getElementById('driverSuggestBox');
  const idEl = document.getElementById('f_id');
  if(!addrEl || !box) return;
  const currentId = idEl ? idEl.value : null;

  let html = '';
  if(exactMatches && exactMatches.length){
    html += `

        ${exactMatches.map(m=>`<span class="badge clay" style="cursor:pointer;" onclick="applyDriverSuggestion('${escapeHtml(m.driver)}')">${escapeHtml(m.driver)}</span> <span style="color:var(--ink-soft);">(跟 ${escapeHtml(m.matchedWith)} 同路)</span>`).join('，')}
      </div>`;
  }

        📍 地址判斷為 <b>${escapeHtml(city)}</b> 區域，這一區平常主要是

        ，點標籤可直接帶入司機欄位。

  } else if(city && !exactMatches.length){

  box.innerHTML = html;

// Dedicated parser for the "auto-detect from note" flow: since the client is already known,
// this scans for EVERY date mention in the text (not just the first) and classifies each as
// either an absence (不來/請假 → leave) or an attendance confirmation (來/會來 → extra, but only
// when that weekday isn't already part of their normal baseline schedule).
function parseNoteForScheduleChanges(clientId, noteText){
  const results = [];
  if(!noteText) return results;
  const client = getClient(clientId);
  const re = /下[週周]([一二三四五六日天])|今天|明天|後天|后天|(\d{1,2})[\/月](\d{1,2})[日号]?/g;
  let m;
  while((m = re.exec(noteText))){
    let resolved = null;
    if(m[1]) resolved = nextWeekdayDate(m[1]);
    else if(m[0]==='今天') resolved = todayStr();
    else if(m[0]==='明天') resolved = addDays(todayStr(),1);
    else if(m[0]==='後天'||m[0]==='后天') resolved = addDays(todayStr(),2);
    else if(m[2] && m[3]){
      const y = parseDate(todayStr()).getFullYear();
      resolved = `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
    }
    if(!resolved) continue;
    const windowText = noteText.slice(m.index, m.index + m[0].length + 15);
    if(/不來|不来|請假|请假/.test(windowText)){
      results.push({date:resolved, type:'leave'});
    } else if(/來|来|加開|加开|到訪|到访/.test(windowText)){
      const wd = weekdayKeyOf(resolved);
      const alreadyBaseline = client && wd && client.baselineDays.includes(wd);
      if(!alreadyBaseline){
        results.push({date:resolved, type:'extra'});
      }
      // if it's already part of their normal baseline, no exception is needed —
      // they're scheduled that day by default already.
    }
  }
  return results;
}

let excCalendarEndDate = null;
const EXC_PICKERS = {
  start: {btnId:'f_exc_date_btn', panelId:'f_exc_calendar', viewMonth:null, emptyLabel:'請選擇日期', get(){ return excCalendarDate; }, set(d){ excCalendarDate = d; }},

function toggleExcPicker(key, evt){
  if(evt) evt.stopPropagation();
  const cfg = EXC_PICKERS[key];
  const panel = document.getElementById(cfg.panelId);
  if(!panel) return;
  const isOpen = panel.style.display === 'block';
  if(isOpen){
    panel.style.display = 'none';
    document.removeEventListener('click', closeExcCalendarOnOutsideClick);
    return;
  }
  const base = cfg.get() || excCalendarDate || new Date();
  cfg.viewMonth = {year: base.getFullYear(), month: base.getMonth()};
  renderExcCalendar(key);
  panel.style.display = 'block';
  positionFixedPanel(document.getElementById(cfg.btnId), panel);
  setTimeout(()=> document.addEventListener('click', closeExcCalendarOnOutsideClick), 0);
}
// The member-edit modal scrolls (.modal{overflow:auto}), which clips any
// position:absolute dropdown inside it once the modal is scrolled — the
// dropdown (or parts of it, like its nav arrows) can render outside the
// modal's visible/clickable area. position:fixed placed via the trigger
// button's real screen coordinates avoids that entirely.
function positionFixedPanel(btn, panel){
  if(!btn || !panel) return;
  const rect = btn.getBoundingClientRect();
  const panelWidth = panel.offsetWidth || 230;
  const panelHeight = panel.offsetHeight || 260;
  let left = rect.left;
  if(left + panelWidth > window.innerWidth - 8) left = Math.max(8, window.innerWidth - panelWidth - 8);
  let top = rect.bottom + 4;
  if(top + panelHeight > window.innerHeight - 8) top = Math.max(8, rect.top - panelHeight - 4);
  panel.style.left = left+'px';
  panel.style.top = top+'px';
}
function closeExcCalendarOnOutsideClick(e){
  ['start','end'].forEach(key=>{
    const cfg = EXC_PICKERS[key];
    const panel = document.getElementById(cfg.panelId);
    const btn = document.getElementById(cfg.btnId);
    if(panel && panel.style.display==='block' && !panel.contains(e.target) && e.target!==btn){
      panel.style.display = 'none';
    }
  });
  document.removeEventListener('click', closeExcCalendarOnOutsideClick);
}
function renderExcCalendar(key){
  const cfg = EXC_PICKERS[key];
  const panel = document.getElementById(cfg.panelId);
  if(!panel || !cfg.viewMonth) return;
  const {year, month} = cfg.viewMonth;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const selected = cfg.get();
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += '<span></span>';
  for(let d=1; d<=daysInMonth; d++){
    const isSelected = selected && selected.getFullYear()===year && selected.getMonth()===month && selected.getDate()===d;
    cells += `<span onclick="pickExcDate('${key}',${year},${month},${d})" style="cursor:pointer; padding:6px 0; text-align:center; border-radius:6px; font-size:12.5px; ${isSelected?'background:var(--teal);color:#fff;font-weight:700;':''}">${d}</span>`;
  }
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <button type="button" onclick="shiftExcMonth('${key}',-1,event)" style="all:unset; cursor:pointer; padding:2px 8px; font-size:13px;">←</button>
      <b style="font-size:12.5px;">${year}年${month+1}月</b>
      <button type="button" onclick="shiftExcMonth('${key}',1,event)" style="all:unset; cursor:pointer; padding:2px 8px; font-size:13px;">→</button>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:10.5px; color:var(--ink-soft); text-align:center; margin-bottom:4px;">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">${cells}</div>
    ${key==='end' ? `<button type="button" onclick="clearExcEndDate()" style="all:unset; cursor:pointer; font-size:11px; color:var(--ink-soft); margin-top:6px; display:block;">清除結束日期</button>`:''}
  `;
}
function shiftExcMonth(key, delta, evt){
  // Stop this click from bubbling to the document-level outside-click
  // listener: renderExcCalendar() below replaces the panel's innerHTML
  // (including the very button that was clicked) while the click is
  // still bubbling, so by the time the outside-click handler runs,
  // e.target is a detached node the panel no longer contains — it reads
  // as "outside" and closes the panel before the new month ever shows.
  if(evt) evt.stopPropagation();
  const cfg = EXC_PICKERS[key];
  let {year, month} = cfg.viewMonth;
  month += delta;
  if(month<0){month=11; year--;}
  if(month>11){month=0; year++;}
  cfg.viewMonth = {year, month};
  renderExcCalendar(key);
  positionFixedPanel(document.getElementById(cfg.btnId), document.getElementById(cfg.panelId));
}
function pickExcDate(key, year, month, day){
  const cfg = EXC_PICKERS[key];
  cfg.set(new Date(year, month, day));
  const btn = document.getElementById(cfg.btnId);
  if(btn){
    btn.textContent = `${year}年${month+1}月${day}日`;
    btn.style.color = 'var(--ink)';
  }
  const panel = document.getElementById(cfg.panelId);
  if(panel) panel.style.display = 'none';
  document.removeEventListener('click', closeExcCalendarOnOutsideClick);
}

function dateToStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function eachDateInRange(startD, endD){
  const out = [];
  let cur = new Date(startD.getFullYear(), startD.getMonth(), startD.getDate());
  const end = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate());
  while(cur <= end){
    out.push(dateToStr(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()+1);
  }
  return out;
}

function addExceptionEntriesForClient(clientId, dates, type, note, driverOverride){
  let addedCount = 0;
  dates.forEach(date=>{
    const dup = (EXCEPTIONS[date]||[]).some(e=>e.type===type && e.clientId===clientId);
    if(dup) return;
    addException(date, {clientId, type, note});
    if(type==='extra' && driverOverride){
      addException(date, {clientId, type:'adjust', driverOverride, note:'特別來指定司機：'+driverOverride});
    }
    addedCount++;
  });
  return addedCount;
}
async function addHistEntryFromModal(type){
  const idInput = document.getElementById('f_id');
  const noteInput = document.getElementById('f_exc_note');
  const driverSelect = document.getElementById('f_exc_driver');
  const linkSpouseCheckbox = document.getElementById('f_exc_linkSpouse');
  if(!idInput) return;
  const clientId = idInput.value;
  if(!excCalendarDate){ showToast('請先選擇日期'); return; }
  const note = noteInput ? noteInput.value.trim() : '';
  const driverOverride = driverSelect ? driverSelect.value : '';

  let dates = [dateToStr(excCalendarDate)];
  if(type==='leave' && excCalendarEndDate){
    if(excCalendarEndDate < excCalendarDate){ showToast('結束日期不能早於開始日期'); return; }
    dates = eachDateInRange(excCalendarDate, excCalendarEndDate);
  }

  let addedCount = addExceptionEntriesForClient(clientId, dates, type, note, driverOverride);

  const c = getClient(clientId);
  const spouseId = getSpouseId(c);
  let spouseAdded = 0;
  let spouse = null;
  if(spouseId && linkSpouseCheckbox && linkSpouseCheckbox.checked){
    spouse = getClient(spouseId);
    if(spouse){
      // extra-with-driver defaults to the spouse's OWN driver, not the primary member's chosen driver,
      // unless a driver was explicitly picked (then apply the same override to both).
      spouseAdded = addExceptionEntriesForClient(spouseId, dates, type, note, driverOverride);
    }
  }

  if(!addedCount && !spouseAdded){ showToast('這些日期已經有相同的紀錄了'); return; }

  await saveExceptions();
  const listEl = document.getElementById('historyList');
  if(listEl) listEl.innerHTML = renderHistoryList(clientId);
  if(noteInput) noteInput.value = '';
  if(driverSelect) driverSelect.value = '';
  excCalendarDate = null;
  excCalendarEndDate = null;
  const btn = document.getElementById('f_exc_date_btn');
  if(btn){ btn.textContent = '請選擇日期'; btn.style.color = 'var(--ink-soft)'; }
  const endBtn = document.getElementById('f_exc_end_date_btn');
  if(endBtn){ endBtn.textContent = '不設定（只標記一天）'; endBtn.style.color = 'var(--ink-soft)'; }
  const dayWord = addedCount>1 ? `共 ${addedCount} 天` : '';
  const spouseWord = spouseAdded ? `，也一併標記配偶「${clientLabel(spouse)}」` : '';
  showToast((type==='leave' ? `已標記請假${dayWord}` : `已標記特別來${dayWord}，已自動排入司機路線`) + spouseWord + '並自動存檔');
  render();
}

async function saveMemberModal(isNew){
  const id = document.getElementById('f_id').value.trim();
  if(!id){ showToast('請輸入會員編號'); return; }
  const originalIdInput = document.getElementById('f_id_original');
  const originalId = originalIdInput ? originalIdInput.value : id;
  const idChanged = !isNew && id !== originalId;
  if((isNew || idChanged) && getClient(id)){ showToast('此編號已存在'); return; }

  const days = Array.from(document.querySelectorAll('#f_days .driver-chip.active')).map(el=>el.dataset.day);
  const obj = {
    id,
    enName: document.getElementById('f_en').value.trim(),
    cnName: document.getElementById('f_cn').value.trim(),
    address: document.getElementById('f_addr').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    baselineDays: days,
    transportMode: document.getElementById('f_transport').value,
    driver: document.getElementById('f_driver').value.trim(),
    dietary: document.getElementById('f_diet').value.trim(),
    relationship: document.getElementById('f_rel').value.trim(),
    visitor: document.getElementById('f_visitor').checked,
    insuranceDaysPerWeek: Number(document.getElementById('f_insdays').value)||0,
    bossApprovedDays: Number(document.getElementById('f_bossdays').value)||0,
    status: document.getElementById('f_status').value,
    subMode: document.getElementById('f_submode').value,
    note: document.getElementById('f_note').value.trim(),
  };

  if(isNew){
    CLIENTS.push(obj);
  } else {
    const idx = CLIENTS.findIndex(c=>c.id===originalId);
    if(idx===-1){ showToast('找不到原本的會員資料，儲存失敗'); return; }
    CLIENTS[idx] = obj;
    if(idChanged){
      // 編號改變了，連帶把歷史紀錄（請假/加開等）裡的會員編號也一起更新，避免對不起來
      Object.keys(EXCEPTIONS).forEach(date=>{
        (EXCEPTIONS[date]||[]).forEach(e=>{ if(e.clientId===originalId) e.clientId = id; });
      });
    }
  }
  await saveClients();
  if(idChanged){
    await saveExceptions();
  }

  // Auto-detect schedule changes mentioned in the note (e.g. "周一請假,周二會來")
  // and automatically create/update the matching exceptions — no separate confirmation needed.
  // Skip anything that already has a matching exception for this client+date, so re-saving the
  // same note (e.g. after editing an unrelated field) doesn't create duplicate records.
  const changes = parseNoteForScheduleChanges(id, obj.note||'').filter(r=>{
    return !(EXCEPTIONS[r.date]||[]).some(e=>e.type===r.type && e.clientId===id);
  });
  if(changes.length){
    changes.forEach(r=>{
      addException(r.date, {clientId:id, type:r.type, note:'依備註自動偵測：'+obj.note});
    });
    await saveExceptions();
    const leaveCount = changes.filter(r=>r.type==='leave').length;
    const extraCount = changes.filter(r=>r.type==='extra').length;
    const parts = [];
    if(leaveCount) parts.push(`${leaveCount} 筆請假`);
    if(extraCount) parts.push(`${extraCount} 筆加開`);
    showToast(`已儲存，並自動偵測到 ${parts.join('、')}`);
  } else {
    showToast('已儲存');
  }

  if(isNew){
    // A brand-new record's form doesn't have the leave/special-visit
    // exception tools or the delete button (they need an existing
    // record to attach to) — reopen once, now in "editing" mode, so
    // those become available. This only happens on the very first save.
    closeMemberModal();
    openMemberModal(id);
  } else {
    // Keep the modal open exactly as it is (no close/reopen — that used
    // to cause a visible flash and reset scroll position/focus) so staff
    // can keep editing the same record continuously and close it
    // themselves whenever they're actually done. Just sync the hidden
    // "original id" field in case the ID changed, and clear the
    // unsaved-changes flag.
    if(originalIdInput) originalIdInput.value = id;
    window.__memberModalDirty = false;
  }
  render();
}

function filterScheduleRows(query){
  const q = (query||'').trim().toLowerCase();
  const rows = document.querySelectorAll('#scheduleTbody tr');
  let visible = 0;
  rows.forEach(row=>{
    const hay = row.dataset.search || '';
    const match = !q || hay.includes(q);
    row.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  const counter = document.getElementById('schedVisibleCount');
  if(counter) counter.textContent = visible;
}

function openPrintInNewTab(){
  if(!__lastPrintDoc){ showToast('沒有可開啟的列印內容'); return; }
  const hint = `🖨 列印前請確認列印視窗的「配置」欄位選的是<b>${__lastPrintDoc.orientation==='portrait'?'直向':'橫向'}</b>（瀏覽器有時會記住上次的設定，需要手動選一次）`;
  const doc = buildPrintDocHtml(__lastPrintDoc, hint);

  // Open a blank tab first (direct result of the click, so it isn't treated as a popup),
  // then write the HTML straight into it. This avoids the browser's "download this blob"
  // heuristic that can trigger when navigating a new tab directly to a blob: URL.
  const win = window.open('', '_blank');
  if(!win){
    // Popup fully blocked — fall back to a real download so the person can still get the content.
    const blob = new Blob([doc], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${__lastPrintDoc.title}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
    showToast('瀏覽器擋住了新分頁，已改為下載檔案，請打開後列印');
    return;
  }
  win.document.open();
  win.document.write(doc);
  win.document.close();
  try{ win.focus(); }catch(e){}
  showToast('已在新分頁開啟，請在該分頁按 Ctrl+P／⌘+P 列印');
}

function idCompare(idA, idB){
  const aV = typeof idA==='string' && idA.charAt(0)==='V';
  const bV = typeof idB==='string' && idB.charAt(0)==='V';
  if(aV !== bV) return aV ? 1 : -1;
  const an = Number(idA), bn = Number(idB);
  const aNum = !isNaN(an), bNum = !isNaN(bn);
  if(aNum && bNum) return an - bn;
  if(aNum !== bNum) return aNum ? -1 : 1;
  return String(idA).localeCompare(String(idB));
}

// Sorts a scheduled list so married couples (relationship contains "夫妻")
// sit next to each other, ordered by the lower ID in each couple; everyone
// else (and any couple whose partner isn't scheduled today) falls back to
// plain ID order.
function sortWithCouplesGrouped(schedArr){
  const scheduledIds = new Set(schedArr.map(x=>x.client.id));
  function explicitPartnerId(client){
    const rel = client.relationship || '';
    if(!/夫妻/.test(rel)) return null;
    const selfEsc = String(client.id).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let m = rel.match(new RegExp(selfEsc+'\\/([^\\s·]+?)夫妻'));
    if(m) return m[1];
    m = rel.match(new RegExp('([^\\s·]+?)\\/'+selfEsc+'夫妻'));
    if(m) return m[1];
    return null;
  }
  // Fallback for couples noted without an explicit "ID/ID夫妻" pair
  // (e.g. "131的朋友，夫妻") — group anyone scheduled today who shares
  // that exact relationship text.
  const relTextGroups = {};
  schedArr.forEach(x=>{
    const rel = (x.client.relationship||'').trim();
    if(rel && /夫妻/.test(rel) && !explicitPartnerId(x.client)){
      (relTextGroups[rel] = relTextGroups[rel]||[]).push(x.client.id);
    }
  });
  const groupMinRank = {};
  schedArr.forEach(x=>{
    let ids = [x.client.id];
    const partnerId = explicitPartnerId(x.client);
    if(partnerId && scheduledIds.has(partnerId)) ids.push(partnerId);
    const rel = (x.client.relationship||'').trim();
    if(rel && relTextGroups[rel] && relTextGroups[rel].length>1) ids = relTextGroups[rel];
    groupMinRank[x.client.id] = ids.reduce((min,id)=> idCompare(id,min)<0 ? id : min, ids[0]);
  });
  return schedArr.slice().sort((a,b)=>{
    const gc = idCompare(groupMinRank[a.client.id], groupMinRank[b.client.id]);
    if(gc !== 0) return gc;
    return idCompare(a.client.id, b.client.id);
  });
}

/* =========================================================
   Driver Routes
   ========================================================= */
let driverDate = addDays(todayStr(), 1);
let driverFilter = 'all';

/* ---------- driver route ordering / Google Maps hand-off ----------
   This page has no live map or traffic data, and the published Artifact's
   security sandbox blocks calling any mapping/geocoding API from inside
   it — so real turn-by-turn route optimization can't run in here. What we
   CAN reliably do: (1) keep every stop at the exact same address grouped
   together in the list, and (2) build a one-click Google Maps link,
   starting from the center, through that driver's stops — Google Maps
   itself then has the live traffic data and an "optimize order" option
   to actually sequence the trip efficiently. */
const CENTER_DEPOT_ADDRESS = '1275 E Holt Ave, Pomona, CA 91767';
function normalizeAddressForSort(addr){
  return (addr||'').replace(/\s+/g,' ').trim().toLowerCase();
}
// 這個地址（中心後門那棟）在司機路線排序時要固定排在最下面（最後一站）
const ROUTE_SORT_LAST_PREFIX = '755 north palomares street pomona';
function isRouteSortLastAddress(addr){
  return normalizeAddressForSort(addr).indexOf(ROUTE_SORT_LAST_PREFIX) === 0;
}
function compareAddressesForRoute(addrA, addrB){
  const lastA = isRouteSortLastAddress(addrA) ? 1 : 0;
  const lastB = isRouteSortLastAddress(addrB) ? 1 : 0;
  if(lastA !== lastB) return lastA - lastB;
  return normalizeAddressForSort(addrA).localeCompare(normalizeAddressForSort(addrB));
}
// Google 地圖的地址搜尋對中文字很不穩定（常常整個地址都搜不到），
// 所以組路線連結前，先把備註用的中文字、全形/半形括號裡的附註都拿掉，只留英文地址本身。
function sanitizeAddressForMaps(addr){
  let a = (addr||'');
  a = a.replace(/（[^）]*）/g, ' ');   // 全形括號備註，例如（后门A座）（女儿电话：...）
  a = a.replace(/\([^)]*\)/g, ' ');   // 半形括號備註
  a = a.replace(/[一-鿿]/g, ' '); // 殘留的中文字（漢字）
  a = a.replace(/[，、／]/g, ' ');    // 中文標點
  a = a.replace(/\s+/g,' ').replace(/,\s*,/g, ',').replace(/^[,\s]+|[,\s]+$/g, '').trim();
  return a;
}
// encodeURIComponent alone leaves spaces as %20, which some builds of the
// Google Maps app show as raw literal text in the origin/destination boxes
// instead of decoding them into the address — using "+" (the standard
// application/x-www-form-urlencoded style Google's own URL examples use)
// avoids that.
function mapsEncode(str){
  return encodeURIComponent(str).replace(/%20/g, '+');
}
function buildGoogleMapsRouteUrl(stops){
  const clean = (stops||[]).map(a=>sanitizeAddressForMaps(a)).filter(Boolean);
  if(!clean.length) return null;
  const MAX_WAYPOINTS = 23; // Google Maps directions URL practical limit
  const capped = clean.slice(0, MAX_WAYPOINTS);
  // Round trip back to the center, every stop in between is a waypoint —
  // one link covers the whole run, not just the way out.
  //
  // No "origin" param on purpose: per Google's Maps URL docs, dir_action=navigate
  // only auto-launches turn-by-turn navigation when the origin is the device's
  // current location (omitted, or close to it) — a fixed origin address always
  // falls back to a route-preview screen that needs a manual "Start" tap. Since
  // drivers open this from wherever they actually are, leaving origin out is what
  // gets them real one-tap navigation.
  const destination = mapsEncode(CENTER_DEPOT_ADDRESS);
  const waypoints = capped.map(a=>mapsEncode(a)).join('|');
  let url = `https://www.google.com/maps/dir/?api=1&destination=${destination}&travelmode=driving&dir_action=navigate`;
  if(waypoints) url += `&waypoints=${waypoints}`;
  return url;
}
function openDriverRouteInMaps(driverName){
  const wd = weekdayKeyOf(driverDate);
  if(!wd){ showToast('週末無排班'); return; }
  const sched = getScheduledForDate(driverDate).filter(x=>x.client.transportMode==='company' && (x.client.driver||'未指派司機')===driverName);
  const stops = sched
    .slice()
    .sort((a,b)=> compareAddressesForRoute(a.client.address, b.client.address))
    .map(x=>x.client.address)
    .filter(Boolean);
  const url = buildGoogleMapsRouteUrl(stops);
  if(!url){ showToast('這位司機今天沒有地址可以規劃路線'); return; }
  // 注意：這個頁面是在受限的沙盒 iframe 裡執行，window.open() 常常會被瀏覽器悄悄擋掉、
  // 完全沒有反應（跟之前 window.print()/window.prompt() 被擋是同一類問題）。
  // 所以改成彈出一個小視窗，裡面放一個「真的連結」讓使用者自己點（比較容易成功開新分頁），
  // 同時附上「複製連結」按鈕，萬一點了還是沒反應，可以把連結複製貼到瀏覽器或手機地圖 App 開啟。

const DRIVER_LOAD_WARN_THRESHOLD = 6; // 沒有個別設定車輛座位/趟數時的預設座位數
// DRIVER_CAPACITIES[d] = { seats, trips } —— 該司機車輛座位數 × 當天可接送趟數，
// 相乘即為當天實際可載總人數上限。舊資料若是單一數字，視為「座位數，跑 1 趟」。
function getDriverCapacityInfo(d){
  const v = DRIVER_CAPACITIES[d];
  if(v && typeof v === 'object'){
    const seats = (typeof v.seats === 'number' && v.seats > 0) ? v.seats : DRIVER_LOAD_WARN_THRESHOLD;
    const trips = (typeof v.trips === 'number' && v.trips > 0) ? v.trips : 1;
    return {seats, trips};
  }
  if(typeof v === 'number' && v > 0) return {seats: v, trips: 1};
  return {seats: DRIVER_LOAD_WARN_THRESHOLD, trips: 1};
}
function getDriverCapacity(d){
  const {seats, trips} = getDriverCapacityInfo(d);
  return seats * trips;
}

async function addToDriverRouteById(){
  const input = document.getElementById('routeAddIdInput');
  const id = input.value.trim();
  if(!id){ showToast('請輸入編號'); return; }
  const c = getClient(id);
  if(!c){ showToast(`找不到編號 ${id} 的會員`); return; }

  const driverSelect = document.getElementById('routeAddDriverSelect');
  const chosenDriver = driverSelect ? driverSelect.value : '';

  const wd = weekdayKeyOf(driverDate);
  const alreadyBaseline = wd && c.baselineDays.includes(wd) && c.status==='active';
  const dayExc = EXCEPTIONS[driverDate]||[];
  const hasLeave = dayExc.some(e=>e.type==='leave' && e.clientId===id);
  const hasExtra = dayExc.some(e=>e.type==='extra' && e.clientId===id);

  if((alreadyBaseline && !hasLeave) || hasExtra){
    // already scheduled today — just apply/replace driver override if a specific driver was chosen
    if(chosenDriver){
      if(EXCEPTIONS[driverDate]){
        EXCEPTIONS[driverDate] = EXCEPTIONS[driverDate].filter(e=>!(e.type==='adjust' && e.clientId===id));
      }
      addException(driverDate, {clientId:id, type:'adjust', driverOverride:chosenDriver, note:'手動指定今日司機'});
      await saveExceptions();
      showToast(`已將 ${clientLabel(c)} 的今日司機改為 ${chosenDriver}`);
    } else {
      showToast(`${clientLabel(c)} 今天已經在路線名單裡了`);
    }
    input.value = '';
    render();
    return;
  }

  // not currently scheduled today -> add as extra, with optional driver override
  if(hasLeave){
    EXCEPTIONS[driverDate] = EXCEPTIONS[driverDate].filter(e=>!(e.type==='leave' && e.clientId===id));
  }
  const entry = {clientId:id, type:'extra', note:'依編號手動加入路線'};
  if(chosenDriver) entry.driverOverride = chosenDriver;
  addException(driverDate, entry);
  await saveExceptions();
  input.value = '';
  showToast(`已將 ${clientLabel(c)} 加入今日路線`);
  render();
}

function removeFromDriverRoute(clientId){
  const c = getClient(clientId);
  if(!c){ showToast('找不到此會員'); return; }
  const dayExc = EXCEPTIONS[driverDate]||[];
  const extraEntry = dayExc.find(e=>e.type==='extra' && e.clientId===clientId);
  if(extraEntry){
    // this person was only on today's route via a manual add/exception — just remove that entry
    removeException(driverDate, extraEntry.id);
    saveExceptions().then(()=>{ showToast(`已從今日路線移除 ${clientLabel(c)}`); render(); });
    return;
  }
  // otherwise they are on their normal baseline schedule — removing means marking leave for the day
  openLeaveModal(clientId, driverDate);
}

// When a driver's day list is over their per-trip seat count but still
// within seats×trips, split it into labeled trips instead of one overloaded
// list. Anyone whose note contains "候補" (standby) is treated as lowest
// priority — they only ride an earlier trip if there's room left over
// after everyone else, otherwise they're pushed to a later trip.
function splitIntoTrips(entries, seats, trips){
  if(trips<=1 || entries.length<=seats) return [entries];
  const isStandby = x => /候補/.test(x.client.note||'');
  const ordered = [...entries.filter(x=>!isStandby(x)), ...entries.filter(isStandby)];
  const result = [];
  for(let i=0;i<trips;i++){
    const chunk = ordered.slice(i*seats, (i+1)*seats);
    if(chunk.length) result.push(chunk);
  }
  // Still more people than seats×trips can hold — append the remainder to
  // the last trip so nobody silently disappears from the printed sheet;
  // the existing overload warning (⚠ 載量偏高) is what flags this to staff.
  const leftover = ordered.slice(trips*seats);
  if(leftover.length && result.length) result[result.length-1].push(...leftover);
  return result;
}

function monthDates(yearMonthStr){
  // yearMonthStr like "2026-08" -> all weekday (Mon-Fri) date strings in that month
  const [y,m] = yearMonthStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const out = [];
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(weekdayKeyOf(ds)) out.push(ds);
  }
  return out;
}
function monthUsage(clientId, yearMonthStr){
  const dates = monthDates(yearMonthStr);
  let count = 0;
  dates.forEach(d=>{
    if(getScheduledForDate(d).some(x=>x.client.id===clientId)) count++;
  });
  return count;
}
// How many times each weekday (Mon..Fri) actually occurs within a given month —
// used so the monthly quota reflects real calendar weeks (4 vs 5) instead of a flat x4.
function weekdayOccurrencesInMonth(yearMonthStr){
  const dates = monthDates(yearMonthStr);
  const counts = {Mon:0,Tue:0,Wed:0,Thu:0,Fri:0};
  dates.forEach(d=>{ counts[weekdayKeyOf(d)]++; });
  return counts;
}
// Quota for the month = sum of actual occurrences of each weekday the client is
// normally scheduled on. Falls back to weeklyDays * average-weeks if the client's
// baselineDays count doesn't match their approved weekly days (e.g. boss override).
function monthlyQuotaFor(client, yearMonthStr, weeklyDaysOverride){
  const weeklyDays = weeklyDaysOverride!=null ? weeklyDaysOverride : (client.insuranceDaysPerWeek||0);
  const occ = weekdayOccurrencesInMonth(yearMonthStr);
  if(client.baselineDays && client.baselineDays.length === weeklyDays && weeklyDays>0){
    return client.baselineDays.reduce((sum,d)=>sum+(occ[d]||0), 0);
  }
  // fallback: no matching baseline pattern — approximate using average weekday occurrence
  const totalWeekdayDates = monthDates(yearMonthStr).length;
  const avgWeeksInMonth = totalWeekdayDates/5;
  return Math.round(weeklyDays * avgWeeksInMonth);
}

let insuranceMonthAnchor = todayStr().slice(0,7); // "YYYY-MM"

function renderInsurance(root){
  const ym = insuranceMonthAnchor;
  const [y,m] = ym.split('-').map(Number);
  const monthLabel = `${y}年${m}月`;
  const clients = CLIENTS.filter(c=>c.status==='active').sort((a,b)=>a.enName.localeCompare(b.enName));

  const rows = clients.map(c=>{
    const used = monthUsage(c.id, ym);
    const weeklyApproved = c.insuranceDaysPerWeek||0;
    const monthlyQuota = monthlyQuotaFor(c, ym);
    const remaining = monthlyQuota - used;
    const bossWeekly = c.bossApprovedDays||0;
    const bossMonthlyQuota = bossWeekly ? monthlyQuotaFor(c, ym, bossWeekly) : 0;
    return {c, used, weeklyApproved, monthlyQuota, remaining, bossWeekly, bossMonthlyQuota};
  }).filter(r=>r.monthlyQuota>0 || r.used>0);

  rows.sort((a,b)=> a.remaining - b.remaining);

  root.innerHTML = `
    <div class="topbar">
      <div>
        <div class="page-title">保險天數追蹤</div>
        <div class="page-sub">${monthLabel} · 依會員實際排班星期，計算當月真實出現次數作為總天數</div>
      </div>
      <div class="actions" style="display:flex; gap:8px; align-items:center;">
        <button class="btn ghost sm" onclick="shiftInsMonth(-1)">← 上個月</button>
        <input type="month" id="insMonthInput" value="${ym}">
        <button class="btn ghost sm" onclick="shiftInsMonth(1)">下個月 →</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="datatable">
        <thead><tr>
          <th>姓名</th><th>核准天數／週</th><th>保險當月總天數</th><th>老闆特批天數</th>
          <th>本月已到</th><th>剩餘天數（依保險）</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td><b>${escapeHtml(r.c.enName)}</b><br><span style="color:var(--ink-soft);font-size:12px;">${escapeHtml(r.c.cnName)}</span></td>
              <td>${r.weeklyApproved} 天</td>
              <td><b>${r.monthlyQuota}</b> 天</td>
              <td>${r.bossWeekly ? `<span class="badge amber">${r.bossWeekly} 天／週（約 ${r.bossMonthlyQuota} 天／月）</span>` : '—'}</td>
              <td><b>${r.used}</b></td>
              <td><span class="badge ${r.remaining<0?'red':(r.remaining===0?'amber':'')}">${r.remaining}</span></td>
            </tr>
          `).join('') || `<tr><td colspan="6"><div class="empty-state">尚無設定保險天數的會員資料</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('insMonthInput').addEventListener('change', e=>{ insuranceMonthAnchor=e.target.value; render(); });
}
function shiftInsMonth(n){
  const [y,m] = insuranceMonthAnchor.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  insuranceMonthAnchor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  render();
}

/* =========================================================
   Backup / Restore (manual sync safety net across devices)
   ========================================================= */
function exportBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    clients: CLIENTS,
    exceptions: EXCEPTIONS,
    capacities: DRIVER_CAPACITIES
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `長者中心資料備份_${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('已匯出備份檔案');
}

function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const payload = JSON.parse(e.target.result);
      if(!payload.clients || !payload.exceptions){ showToast('檔案格式不正確'); evt.target.value=''; return; }
      openConfirmModal(
        `確定要匯入此備份嗎？\n備份時間：${payload.exportedAt}\n會員數：${payload.clients.length}\n\n這會覆蓋目前畫面上的資料並存回共用資料庫。`,
        async ()=>{
          CLIENTS = payload.clients;
          EXCEPTIONS = payload.exceptions;
          DRIVER_CAPACITIES = (payload.capacities && typeof payload.capacities === 'object') ? payload.capacities : {};
          await saveClients();
          await saveExceptions();
          showToast('匯入完成，資料已更新');
          render();
        },
        '確定匯入'
      );
    }catch(err){
      console.error(err);
      showToast('匯入失敗，檔案可能損毀');
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

</script>
